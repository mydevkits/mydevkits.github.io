{
 id:"fail-canceled", group:"fail",
 title:"The customer canceled their old service early",
 when:"The number is disconnected before the port completed.",
 timeline:"Act within hours. This one has a real deadline and the deadline is not ours.",
 summary:"The worst thing that happens in this job and mostly preventable. There is exactly one thing that actually fixes it: getting the old carrier to switch the number back on. Everything else is damage control. So do that first, do it today, and do the rest in parallel.",
 steps:[
 {t:"Get the customer on the phone with their old carrier, today",who:"Team Lead and Customer together", priority:true,
  d:"A canceled number is not deleted straight away. The carrier holds it for a period before it goes back into the pool and gets handed to somebody else. While it is still in that hold, the carrier can usually reinstate it. After it is reassigned it is gone permanently and no escalation brings it back. Nobody will quote you a hold length, so treat it as days rather than weeks. The customer has to place the call, because the carrier will not discuss a closed account with us. Stay on the line so you hear the answer yourself instead of getting it secondhand tomorrow. Ask for the number to be reinstated on the same account, not for a new number. Ask whether it has already been released. Ask what reconnection costs and whether it starts a new contract term, and push for month to month if it does. Ask for call forwarding to the temporary number while the port runs. If the front line says no, ask for the retention department or the porting department by name before you hang up.",
  where:"This is not a system task. It is a phone call the customer makes with you listening. Record the representative name, the ticket number and the date the number goes live again.",
  forms:["number-recovery"],
  check:["Customer on the phone with the old carrier, us listening in","Asked to reinstate the existing number on the existing account","Asked whether the number has already been released","Reconnection cost and contract terms known","Asked for forwarding to the temporary number","Representative name and ticket number recorded","Escalated to retention or porting if the front line refused"]},
 {t:"If it comes back on, do not let them cancel it again",who:"Team Lead", priority:true,
  d:"This is where the recovery gets thrown away. The customer sees another month of billing from a carrier they thought they were rid of, cancels a second time, and the number dies again, this time usually for good. Say it out loud and put it in writing: the port itself ends the old service, so leave the account open and keep paying until we confirm the port completed. The second thing to catch here is that reconnecting often issues a new account number, and sometimes changes which number is the main billing number on the account. Any LOA or account detail you collected before the cancellation is now wrong, and submitting it is a guaranteed rejection. Pull a fresh bill, collect the new details, and get a new LOA signed and dated today before you resubmit.",
  where:"Fresh LOA from the forms list. New port order in DialStack with the new account number, because editing the old rejected one carries the stale details forward.",
  forms:["loa-voice"],
  check:["Customer told, in writing, not to cancel again","Fresh bill or account record obtained after reconnection","New account number recorded","Main billing number on the account reconfirmed","New PIN or passcode captured if one was set","Fresh LOA signed and dated today","Port resubmitted with the new details"]},
 {t:"Give them a working phone while that is going on",who:"Onboarding", priority:true,
  d:"Run this at the same time as the carrier call, not after it. Be clear with the practice about what it is: a working phone so staff can call people back, not a rescue of their inbound calls. You cannot forward a disconnected number, because the account that owned it is gone and there is no setting anywhere that redirects those calls. Only the old carrier can, and only by switching the number back on. Also check whether any other line on the old account survived, a fax line or a second number often does, and a line that is still alive CAN be forwarded.",
  where:"New number: Bandwidth Dashboard, Numbers, then Buy Numbers, in their area code. Then point it at their staff in DialStack.",
  check:["New number provisioned and ringing their staff","Practice confirmed they can call out and receive","Front desk told to start calling today's patients directly","Checked whether any other line on the old account survived"]},
 {t:"Only once the carrier has said no, start changing listings",who:"Onboarding",
  d:"Hold this until reconnection is genuinely dead, otherwise you change every listing and then change them all back. When it is dead, the order matters: Google Business Profile first, because that is where most new patients look, then website, voicemail greeting, social profiles, booking pages, insurance directories, door sign, email signatures. And say plainly what cannot be fixed, on day one rather than in week three: printed signage, business cards, referral pads, and the number already saved in patients' phones.",
  forms:["number-recovery"],
  check:["Reconnection confirmed dead in writing","Google Business Profile updated","Website updated","Voicemail greeting updated on anything still working","Insurance directories started","Told them plainly what cannot be updated"]},
 {t:"Be honest about the outcome",who:"Team Lead",
  d:"If the number is genuinely gone, say so early. The instinct is to keep saying we are working on it. That costs them the weeks they needed to be rebuilding their listings.",
  check:["Customer told the truth early","Help offered with listings and signage"]}
 ],
 watch:["The clock is the old carrier's hold period and nobody will tell you how long it is. A call today is worth far more than a perfect plan tomorrow.","This is why the do not cancel instruction goes in writing and gets repeated at every stage.","After a reconnection, the account number is probably different. Resubmitting the old paperwork will get you rejected."],
 say:"\"I have to be straight with you. Once a number is disconnected we cannot forward it, there is no switch on our side for that. The one thing that actually fixes this is your old carrier turning the number back on, and it gets harder every day we wait. You have to be the one who calls them, they will not talk to me about a closed account. Can you dial them now and keep me on the line? While that is going I am setting you up a working number today.\""
},

var FORMS=[

{
 id:"number-recovery",
 name:"Emergency: their number is dead, get it back on",
 kind:"Checklist and script",
 priority:true,
 who:"The customer makes the carrier call. You stay on the line with them.",
 why:"The single best outcome is getting the old carrier to switch the number back on. Once it is live again we port it properly and it never goes dark a second time. Everything else on this page is what you do while that is in progress, or what you fall back to if the carrier says no.",
 after:"Work top to bottom. Section 1 is time sensitive and beats every other thing on this list.",
 doc:true,
 body:
"NUMBER RECOVERY\n"+
"Practice: [[BUSINESS NAME]]\n"+
"Dead number: [[DEAD NUMBER]]\n"+
"Old carrier: [[CURRENT CARRIER]]\n"+
"Date it was canceled: [[CANCEL DATE]]\n"+
"Date: [[DATE]]\n\n"+

"1. RECONNECT THE OLD SERVICE. Start this in the first hour.\n\n"+
"   Why this is first: a canceled number is not deleted straight away. The\n"+
"   carrier holds it for a period before it goes back into the pool and can\n"+
"   be handed to somebody else. While it is still in that hold the carrier\n"+
"   can usually switch it back on. After it is reassigned it is gone for\n"+
"   good and no amount of escalation brings it back. The hold length varies\n"+
"   by carrier and nobody will quote you one. Treat it as days.\n\n"+
"   The customer has to make this call. The carrier will not discuss a\n"+
"   closed account with us. Get them on the phone, have them dial the\n"+
"   carrier, and stay on the line so you hear the answer yourself.\n\n"+
"   [ ] Customer on the phone with [[CURRENT CARRIER]], we are listening in\n"+
"   [ ] Asked in these words: reinstate the existing number on the existing\n"+
"       account. Not a new number. Not a new account.\n"+
"   [ ] Asked whether the number has already been released or reassigned\n"+
"   [ ] Asked what it costs to reconnect: $ ______________\n"+
"   [ ] Asked whether reconnecting starts a new contract term\n"+
"       If they want a 1 or 2 year commitment, ask for month to month\n"+
"       instead. Do not let them sign a term for a number we are\n"+
"       porting away in three weeks.\n"+
"   [ ] Asked for call forwarding to [[NEW NUMBER]] while it is reconnected\n"+
"   [ ] Representative name: ______________________________\n"+
"   [ ] Ticket or reference number: _______________________\n"+
"   [ ] Date the number will be live again: _______________\n\n"+
"   If the front line says no, do not hang up. Ask for the retention\n"+
"   department or the porting department by name. They handle this far\n"+
"   more often than the first person who answers, and they have authority\n"+
"   the first person does not.\n\n"+

"2. THE PART EVERYONE GETS WRONG AFTER RECONNECTION\n\n"+
"   [ ] Told the customer, in plain words, DO NOT CANCEL AGAIN.\n"+
"       The port itself ends the old service. If they cancel a second\n"+
"       time to save a month of billing, the number dies again and this\n"+
"       time it very likely will not come back.\n"+
"   [ ] Got a FRESH copy of the bill or account record after reconnection.\n"+
"       Reconnecting often issues a new account number, and sometimes a\n"+
"       new main billing number on the account. Any LOA or account detail\n"+
"       collected before the cancellation is now wrong, and submitting it\n"+
"       is a guaranteed rejection.\n"+
"   [ ] New account number: _______________________________\n"+
"   [ ] Main billing number on the account now: ___________\n"+
"   [ ] New PIN or passcode if one was set on reconnection: _______\n"+
"   [ ] Fresh LOA signed with the new details, dated today\n"+
"   [ ] Port restarted and submitted\n"+
"   [ ] Customer told to keep paying the old carrier until we confirm the\n"+
"       port completed\n\n"+

"3. GIVE THEM A WORKING PHONE, running at the same time as section 1\n\n"+
"   [ ] New number provisioned in their area code and ringing their staff\n"+
"   [ ] Confirmed the practice can make and receive calls on it\n"+
"   [ ] Front desk told they can start calling today's patients directly now\n\n"+
"   Be clear with them that this is a working phone, not a rescue of their\n"+
"   inbound calls. A disconnected number cannot be forwarded, because the\n"+
"   account that held it is gone. There is no setting anywhere that\n"+
"   redirects those calls. Only the old carrier can, and only by switching\n"+
"   the number back on.\n\n"+

"4. CHECK WHAT ELSE SURVIVED\n\n"+
"   [ ] Is any other line on that account still working?\n"+
"       A fax line or second number may not have been canceled.\n"+
"       If one is alive, it CAN be forwarded. Do that.\n"+
"   [ ] Is their texting still working? It may be on a different system.\n\n"+

"5. ONLY IF THE CARRIER SAYS NO: update where patients find them\n\n"+
"   Do not start this while reconnection is still a live possibility, or\n"+
"   you will change every listing and then change them all back.\n\n"+
"   [ ] Google Business Profile           <-- do this one first\n"+
"   [ ] Website header, footer, contact page\n"+
"   [ ] Voicemail greeting on anything still working\n"+
"   [ ] Text message to existing patients, if texting still works\n"+
"   [ ] Facebook and any other social profiles\n"+
"   [ ] Online booking or scheduling pages\n"+
"   [ ] Insurance directory listings (slow, start early)\n"+
"   [ ] Sign on the door\n"+
"   [ ] Email signature for the whole practice\n"+
"   [ ] Any online review profiles\n\n"+
"   What cannot be fixed, say this out loud: printed signage, business\n"+
"   cards, referral pads, and the number already saved in patients'\n"+
"   phones. Those calls are lost. Tell them on day one rather than\n"+
"   letting them discover it in week three.\n\n"+

"FOLLOW UP\n\n"+
"  [ ] Called the practice at end of day one\n"+
"  [ ] Called again on day three\n"+
"  [ ] Reconnection outcome confirmed either way, in writing\n"+
"  [ ] If recovered, port restarted with a fresh LOA and fresh account\n"+
"      details, and the customer knows not to cancel again",
 phone:
"What to say to the practice:\n\n"+
"\"I have to be straight with you. Once a number is disconnected we cannot forward it, because the account that held it is gone. There is no switch on our side for that. The one thing that actually fixes this is your old carrier turning the number back on, and that gets harder every day we wait, so I want to do that right now while I have you.\n\n"+
"You have to be the one who calls them, they will not talk to me about a closed account. Can you dial them now and keep me on the line? I will tell you exactly what to ask for.\n\n"+
"While that is going, I am setting you up a working number today so your staff can call people back.\"\n\n"+

"What the customer should ask the carrier, word for word:\n\n"+
"\"I canceled this account and I need the number reinstated on the same account. Not a new number. Has it been released yet? What does reconnection cost, and does it start a new contract term? I need month to month if so, because I am moving the number to a new provider in a few weeks. And can you put call forwarding on it to my temporary number while that happens?\"",
 tip:"Two things kill this recovery. One, waiting a day before calling, because the number may be reassigned by then. Two, the customer canceling a second time after reconnection to avoid another month of billing. Say both out loud on the first call."
},

{
 id:"naming-glossary",
 name:"What everything is actually called",
 kind:"Reference",
 who:"You, before you talk to a carrier or a customer.",
 why:"A port order is a record in a portal. An LSR is the form the platform generates from it. An LOA is a signed document. Saying the wrong one to a carrier gets you the wrong answer.",
 after:"Nothing to send. Read it once and the rest of the process stops being confusing.",
 body:
"DOCUMENTS, things with signatures or content\n\n"+
"  LOA, Letter of Authorization\n"+
"    The customer's signed permission to move their numbers.\n"+
"    We send the template. The customer signs. It uploads to the port order.\n\n"+
"  Messaging LOA\n"+
"    A SEPARATE signed permission to add texting to a number.\n"+
"    Different document. Does not cover voice. Must be under 30 days old.\n\n"+
"  CSR, Customer Service Record\n"+
"    The losing carrier's own file on the account: exact business name,\n"+
"    service address, account number, every working number.\n"+
"    The customer requests it. Carriers will not give it to us.\n\n"+
"  Bill copy\n"+
"    A recent invoice. Sometimes accepted in place of a CSR.\n\n"+
"  LSR, Local Service Request\n"+
"    The industry form that actually asks the losing carrier to release\n"+
"    the numbers. GENERATED BY THE PLATFORM from your port order.\n"+
"    You never fill one in by hand.\n\n"+
"RECORDS, things that live in a system\n\n"+
"  Port order, or port-in order\n"+
"    The request record you create.\n"+
"    Bandwidth: Numbers, then Port.  DialStack: the port order flow.\n\n"+
"  Hosted messaging order\n"+
"    The request to add texting to a number you do not carry voice for.\n"+
"    Bandwidth: Numbers, then Hosted Messaging.\n\n"+
"  Toll free verification\n"+
"    An application to let a toll free number send texts.\n"+
"    A separate web form, not a portal screen.\n\n"+
"  Brand and Campaign\n"+
"    The two 10DLC registrations. A brand is the business.\n"+
"    A campaign is what you send. The brand comes first.\n\n"+
"NEITHER\n\n"+
"  FOC, Firm Order Commitment\n"+
"    Not a document. The DATE the losing carrier commits to.\n\n"+
"  PIN or passcode\n"+
"    A security code on the phone account. Rarely on the CSR.\n"+
"    Must be asked for separately.\n\n"+
"  BTN, Billing Telephone Number\n"+
"    The number the account is billed under. The account anchor.\n\n"+
"THE SENTENCE THAT CLEARS IT UP\n\n"+
"  You create a PORT ORDER, attach the LOA, and the platform turns it\n"+
"  into an LSR which it sends to the losing carrier. The carrier replies\n"+
"  with an FOC DATE, or a rejection.",
 tip:"Bandwidth's port wizard calls the upload area Documents and Supplemental Information, with a File(s) control for the LOA and a separate field called Person authorizing this port (Name on LOA). Toll free LOAs must be PDF or TIFF."
},

"TEXT MESSAGING TERMS\n\n"+
"By providing your mobile phone number to [[BUSINESS NAME]], you agree to receive\n"+
"text messages from us about your care and your account.\n\n"+
"WHAT WE SEND\n"+
"Appointment reminders and confirmations, forms and paperwork links, billing and\n"+
"payment information, and check up reminders.\n\n"+
"HOW OFTEN\n"+
"Message frequency varies depending on your appointments and account activity.\n\n"+
"COST\n"+
"Message and data rates may apply. These are charged by your mobile carrier, not\n"+
"by us.\n\n"+
"HOW TO STOP\n"+
"Reply STOP to any message to stop receiving text messages. You will receive one\n"+
"confirmation that you have been unsubscribed.\n\n"+
"HOW TO GET HELP\n"+
"Reply HELP to any message, or call our office at [[CONTACT PHONE]].\n\n"+
"PRIVACY\n"+
"Our privacy policy explains how we handle your information and is available at\n"+
"[[WEBSITE]].\n\n"+
"LIABILITY\n"+
"Carriers are not liable for delayed or undelivered messages."
},

{
 id:"cutover-confirm",
 name:"Cutover date confirmation",
 kind:"Email we send",
 who:"Us, to the customer, once the date is confirmed by their old carrier.",
 why:"Puts the date, the expectations and the do not cancel warning in one place they can find later.",
 after:"Save it on the account. Reference it on cutover day.",
 body:
"Subject: Your phone transfer is confirmed for [[CUTOVER DATE]]\n\n"+
"Hello [[CONTACT NAME]],\n\n"+
"Your phone numbers will transfer to us on [[CUTOVER DATE]] starting at\n"+
"[[CUTOVER TIME]].\n\n"+
"WHAT HAPPENS ON THE DAY\n"+
"We will call you before we begin and stay on the line with you. Numbers do not\n"+
"all switch at the same moment, so there may be a short period where things\n"+
"behave oddly. We will test every number with you before we finish.\n\n"+
"WHAT WE NEED FROM YOU\n"+
"Please have [[SITE CONTACT]] available and reachable on the day.\n"+
"Please keep a mobile phone handy until we confirm emergency calling is working.\n\n"+
"IMPORTANT\n"+
"Do not cancel your service with [[CURRENT CARRIER]]. We will keep it running for\n"+
"about three days after the transfer as a safety net, and we will email you when\n"+
"it is safe to cancel.\n\n"+
"If you need to reach us on the day, call [[US_PHONE]].\n\n"+
"[[US_CONTACT]]\n[[US_COMPANY]]",
},

{
 id:"release-old",
 name:"Safe to cancel notice",
 kind:"Email we send",
 priority:true,
 who:"Us, only after every number has been tested and stable for about three days.",
 why:"Until this goes out, the customer cancels nothing. It is the one message that closes the highest risk in the process.",
 after:"Ask them to confirm once they have canceled, and note it on the account.",
 body:
"Subject: You can now cancel your old phone service\n\n"+
"Hello [[CONTACT NAME]],\n\n"+
"Your numbers have transferred successfully and everything has been tested and\n"+
"stable for the last few days.\n\n"+
"You can now cancel your service with [[CURRENT CARRIER]].\n\n"+
"Please let me know once you have done it so I can note it on your account.\n\n"+
"If anything is not working the way you expect, tell me before you cancel and we\n"+
"will sort it out first.\n\n"+
"[[US_CONTACT]]\n[[US_COMPANY]]\n[[US_PHONE]]",
 tip:"Never send this early. The old service is the only real safety net once the numbers have moved."
}
];
</script>
<script>
/* ============ build the porting procedures from the same source
   the Step By Step tool uses, so the two can never drift apart ============ */
(function(){
 if(typeof FLOWS==='undefined') return;
 var gmap={}; if(typeof GROUPS!=='undefined') GROUPS.forEach(function(g){gmap[g.k]=g.label;});
 var n=500;
 FLOWS.forEach(function(f){
   n++;
   var steps=f.steps.map(function(s){
     var o={t:s.t,d:s.d};
     if(s.where) o.where=s.where;
     if(s.check) o.check=s.check;
     if(s.who) o.role=s.who;
     if(s.forms) o.forms=s.forms;
     if(s.priority) o.pri=true;
     if(!s.where && /dialstack|bandwidth|portal|dashboard/i.test(s.d||'')){
       o.gap=true; o.gaptxt="We do not yet know the exact screen path for this step.";
     }
     return o;
   });
   var anygap=steps.some(function(s){return s.gap;});
   SOPS.push({
     id:"SOP-"+n, sec:"port", gen:true,
     status: anygap?"gap":"ready",
     ver:"0.9", owner:"VoIP Support Team Lead",
     title:f.title,
     kind:gmap[f.group]||f.group,
     trigger:f.when||"",
     timing:f.timeline||"",
     why:f.summary||"",
     steps:steps,
     watch:f.watch||[],
     say:f.say||"",
     gaps: anygap?[{q:"Confirm the exact DialStack and Bandwidth screen paths for the steps flagged in this procedure.",
                    who:"DialStack administrator, or whoever on the team uses it most",
                    blocks:"Turning this from a description of the job into instructions somebody new can follow"}]:[]
   });
 });
})();

/* ============ normalize who to ask, and work out when to ask it ============
   The raw entries say things like "Manager, first week" and "Your manager,
   before or on day one". Left as written they split the register into twenty
   near identical piles. This folds them into one short list of people, and
   pulls the timing out into its own field so the register can be read as
   a day one question list. */
var WHEN_ORDER={day1:0,week1:1,later:2};
var WHEN_LABEL={day1:"Day one",week1:"First week",later:"First month"};
function normWho(raw){
 var s=String(raw||'').toLowerCase();
 var when = /day one|first hour|before or on day/.test(s) ? 'day1'
          : /first week|week one/.test(s) ? 'week1' : 'later';
 var who;
 if(/people operations|human resources|\bhr\b/.test(s)) who='People Operations';
 else if(/compliance|legal/.test(s)) who='Your manager, with compliance or legal';
 else if(/dialstack/.test(s) && /bandwidth/.test(s)) who='DialStack or Bandwidth support';
 else if(/dialstack/.test(s) && /the team/.test(s)) who='The team, or DialStack';
 else if(/dialstack/.test(s)) who='DialStack administrator';
 else if(/bandwidth/.test(s)) who='Bandwidth administrator';
 else if(/help desk|ticketing/.test(s)) who='Help desk administrator';
 else if(/internal docs/.test(s)) who='Whoever runs internal docs';
 else if(/marketing/.test(s)) who='Marketing';
 else if(/the team|whoever on the team|uses it most/.test(s)) who='The team';
 else who='Your manager';
 return {who:who, when:when};
}
/* When to ask. The wording of the entry is a hint, but the stronger signal is
   what the question is holding up. A question that blocks a procedure you
   cannot follow at all is a day one question, whatever it says. */
var EARLY_SECS={access:1,shift:1,queue:1,e911:1,hw:1,cross:1};
SOPS.forEach(function(s){
 (s.gaps||[]).forEach(function(g){
   var n=normWho(g.who); g._who=n.who; g._raw=g.who;
   if(n.when!=='later') g._when=n.when;
   else if(s.status==='blocked') g._when='day1';
   else if(s.status==='gap' && EARLY_SECS[s.sec]) g._when='week1';
   else g._when='later';
 });
});
/* a few questions are worth asking in the first hour regardless of where
   they were written, because everything else waits on them */
var DAY_ONE=[/full list of systems this role needs/i,/how do we clock in/i,
 /dialstack login url/i,/success look like for this team/i,/who do i notify when i am sick/i];
SOPS.forEach(function(s){ (s.gaps||[]).forEach(function(g){
 DAY_ONE.forEach(function(r){ if(r.test(g.q)) g._when='day1'; }); }); });

/* ============ state ============ */
var SEC=null, OPEN=null, QRY="", REGBY="when";
try{ var st=localStorage.getItem('sop-sec'); if(st) SEC=st; }catch(e){}
if(!SEC) SEC='how';

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hi(s){
 s=esc(s);
 if(!QRY) return s;
 try{ return s.replace(new RegExp('('+QRY.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); }catch(e){ return s; }
}
function txtOf(s){
 var p=[s.id,s.title,s.trigger,s.why,s.timing,s.owner,s.kind];
 (s.steps||[]).forEach(function(x){p.push(x.t,x.d,x.where,x.gaptxt);(x.check||[]).forEach(function(c){p.push(c);});});
 (s.done||[]).forEach(function(d){p.push(d);});
 (s.fails||[]).forEach(function(f){p.push(f.if,f.then);});
 (s.watch||[]).forEach(function(w){p.push(w);});
 (s.gaps||[]).forEach(function(g){p.push(g.q,g.who,g.blocks);});
 p.push(s.say);
 return p.join(' ').toLowerCase();
}
SOPS.forEach(function(s){ s._t=txtOf(s); });

function matches(s){ return !QRY || s._t.indexOf(QRY.toLowerCase())>-1; }
function inSec(k){ return SOPS.filter(function(s){return s.sec===k && matches(s);}); }
function allGaps(){
 var out=[];
 SOPS.forEach(function(s){
   (s.gaps||[]).forEach(function(g){
     out.push({q:g.q,who:g._who,raw:g._raw,when:g._when,blocks:g.blocks,sid:s.id,st:s.title});
   });
 });
 return out.filter(function(g){
   return !QRY || (g.q+' '+g.who+' '+g.blocks+' '+g.st).toLowerCase().indexOf(QRY.toLowerCase())>-1;
 });
}

/* ============ header stats ============ */
function drawStats(){
 var r=SOPS.filter(function(s){return s.status==='ready';}).length;
 var g=SOPS.filter(function(s){return s.status==='gap';}).length;
 var b=SOPS.filter(function(s){return s.status==='blocked';}).length;
 var q=0; SOPS.forEach(function(s){q+=(s.gaps||[]).length;});
 document.getElementById('stats').innerHTML=
  '<span class="stat"><b>'+SOPS.length+'</b> procedures</span>'+
  '<span class="stat r"><b>'+r+'</b> ready to follow</span>'+
  '<span class="stat g"><b>'+g+'</b> usable with gaps</span>'+
  '<span class="stat b"><b>'+b+'</b> blocked</span>'+
  '<span class="stat"><b>'+q+'</b> open questions to ask</span>';
}

/* ============ nav ============ */
function drawNav(){
 var h='';
 h+='<div class="navlbl">Sections</div>';
 SOP_SECTIONS.forEach(function(s){
   var c=inSec(s.k).length;
   h+='<button class="navbtn'+(SEC===s.k&&!OPEN?' on':'')+'" data-sec="'+s.k+'">'+esc(s.n)+
      '<span class="n">'+c+'</span></button>';
 });
 h+='<div class="navsep"></div>';
 h+='<button class="navbtn'+(SEC==='__gaps'?' on':'')+'" data-sec="__gaps">Gaps register<span class="n">'+allGaps().length+'</span></button>';
 h+='<button class="navbtn'+(SEC==='__all'?' on':'')+'" data-sec="__all">Every procedure<span class="n">'+SOPS.filter(matches).length+'</span></button>';
 var nav=document.getElementById('nav'); nav.innerHTML=h;
 nav.querySelectorAll('.navbtn').forEach(function(b){
   b.onclick=function(){ SEC=b.dataset.sec; OPEN=null;
     try{localStorage.setItem('sop-sec',SEC);}catch(e){}
     draw(); window.scrollTo(0,0); };
 });
}

/* ============ list ============ */
function listRows(items){
 if(!items.length) return '<div class="card"><div class="empty">Nothing matches that.</div></div>';
 return '<div class="card">'+items.map(function(s){
   return '<div class="row" data-id="'+s.id+'">'+
     '<div class="sid">'+esc(s.id)+'</div>'+
     '<div class="rt"><h3>'+hi(s.title)+'</h3>'+
       (s.trigger?'<p>'+hi(s.trigger)+'</p>':'')+
       ((s.gaps&&s.gaps.length)?'<p style="color:#9a6a00">'+s.gaps.length+' open question'+(s.gaps.length>1?'s':'')+'</p>':'')+
     '</div>'+
     '<span class="pill p-'+s.status+'">'+(s.status==='ready'?'Ready':s.status==='gap'?'Gaps':'Blocked')+'</span>'+
   '</div>';
 }).join('')+'</div>';
}

/* ============ detail ============ */
function detail(s){
 var h='<button class="back" id="bk">Back to '+esc(secName(s.sec))+'</button><div class="det">';
 h+='<h2>'+hi(s.title)+'</h2>';
 h+='<div class="gov">'+
   gcell('SOP',s.id)+
   gcell('Owner',s.owner)+
   gcell('Version',s.ver)+
   gcell('Status',s.status==='ready'?'Ready to follow':s.status==='gap'?'Usable, has gaps':'Blocked, missing information')+
   gcell('Last reviewed','Not yet reviewed in service')+
   gcell('Review cycle',/carrier|port|number|dialstack|bandwidth/i.test(s.title+s.sec)?'Quarterly':'Every six months')+
   (s.kind?gcell('Job type',s.kind):'')+
   (s.who?gcell('Who does it',s.who):'')+
   (s.timing?gcell('Timing',s.timing):'')+
 '</div>';

 if(s.trigger) h+=blk('Trigger, what starts this','<p>'+hi(s.trigger)+'</p>');
 if(s.why) h+=blk('Why it matters','<div class="why">'+hi(s.why)+'</div>');

 if(s.steps&&s.steps.length){
  h+='<div class="blk"><h4>Steps</h4><ol class="steps">';
  s.steps.forEach(function(x){
    h+='<li><h5>'+hi(x.t)+(x.pri?' <span class="pill p-blocked" style="vertical-align:2px">Priority</span>':'')+'</h5>';
    if(x.role) h+='<p style="color:#94a0ac;font-size:12.5px">'+esc(x.role)+'</p>';
    if(x.d) h+='<p>'+hi(x.d)+'</p>';
    if(x.where) h+='<div class="where"><b>Where:</b> '+hi(x.where)+'</div>';
    if(x.gap) h+='<div class="gapflag">Gap: '+esc(x.gaptxt||'We do not know this yet. See the open questions below.')+'</div>';
    if(x.forms&&x.forms.length&&typeof FORMS!=='undefined'){
      var names=x.forms.map(function(fid){var f=FORMS.filter(function(z){return z.id===fid;})[0];return f?f.name:fid;});
      h+='<div class="where"><b>Form:</b> '+esc(names.join(', '))+'. Full text is in the Step By Step tool.</div>';
    }
    if(x.check&&x.check.length){
      h+='<ul class="chk">'+x.check.map(function(c){return '<li>'+hi(c)+'</li>';}).join('')+'</ul>';
    }
    h+='</li>';
  });
  h+='</ol></div>';
 }

 if(s.done&&s.done.length)
  h+='<div class="blk"><div class="donebox"><h4>Done means all of this is true</h4><ul class="chk">'+
     s.done.map(function(d){return '<li>'+hi(d)+'</li>';}).join('')+'</ul></div></div>';

 if(s.fails&&s.fails.length)
  h+=blk('When it does not go to plan', s.fails.map(function(f){
     return '<div class="fail"><b>If '+hi(f.if)+'</b>'+hi(f.then)+'</div>';}).join(''));

 if(s.watch&&s.watch.length)
  h+=blk('Watch out for', s.watch.map(function(w){
     return '<div class="fail"><b>Watch</b>'+hi(w)+'</div>';}).join(''));

 if(s.say) h+=blk('What to say','<div class="say">'+hi(s.say)+'</div>');

 if(s.gaps&&s.gaps.length)
  h+='<div class="blk"><div class="gapbox"><h4>Open questions, ask these to finish this procedure</h4>'+
     s.gaps.map(function(g){
       return '<div class="gapitem"><div class="qq">'+hi(g.q)+'</div>'+
              '<div class="mm"><b>Ask:</b> '+hi(g.who)+'</div>'+
              '<div class="mm"><b>Blocks:</b> '+hi(g.blocks)+'</div></div>';
     }).join('')+'</div></div>';

 h+='</div>';
 return h;
}
function gcell(a,b){return '<div><dt>'+esc(a)+'</dt><dd>'+esc(b)+'</dd></div>';}
function blk(t,inner){return '<div class="blk"><h4>'+esc(t)+'</h4>'+inner+'</div>';}
function secName(k){var f=SOP_SECTIONS.filter(function(s){return s.k===k;})[0];return f?f.n:'the list';}

/* ============ gaps register ============ */
function gapsView(){
 var gs=allGaps();
 var d1=gs.filter(function(g){return g.when==='day1';}).length;
 var by={};
 if(REGBY==='when') gs.forEach(function(g){ (by[g.when]=by[g.when]||[]).push(g); });
 else gs.forEach(function(g){ (by[g.who]=by[g.who]||[]).push(g); });
 var keys=Object.keys(by);
 if(REGBY==='when') keys.sort(function(a,b){return WHEN_ORDER[a]-WHEN_ORDER[b];});
 else keys.sort(function(a,b){return by[b].length-by[a].length;});

 var h='<div class="sechead"><h2>Gaps register</h2><p>Everything this manual does not know yet, who to ask, and what it holds up. '+
   gs.length+' open question'+(gs.length===1?'':'s')+', '+d1+' of them worth asking on day one. '+
   'Work this list down and the manual finishes itself.</p></div>';
 h+='<div class="regbar">'+
    '<button class="btn'+(REGBY==='when'?' pri':'')+'" data-by="when">Group by when to ask</button>'+
    '<button class="btn'+(REGBY==='who'?' pri':'')+'" data-by="who">Group by who to ask</button>'+
    '<span style="flex:1"></span>'+
    '<button class="btn" id="copyq">Copy as a list</button>'+
    '<button class="btn" id="printq">Print</button></div>';
 h+='<div id="copyarea"></div>';
 if(!gs.length) return h+'<div class="card"><div class="empty">Nothing matches that.</div></div>';
 keys.forEach(function(k){
   var label = REGBY==='when' ? WHEN_LABEL[k] : k;
   h+='<div class="who"><h3>'+esc(label)+'<span>'+by[k].length+' question'+(by[k].length===1?'':'s')+'</span></h3>';
   by[k].forEach(function(g){
     h+='<div class="qrow"><div class="qq">'+hi(g.q)+'</div>'+
        '<div class="meta"><span class="tag" data-goto="'+g.sid+'">'+esc(g.sid)+'</span>'+
        esc(g.st)+'</div>'+
        '<div class="meta"><b>'+(REGBY==='when'?'Ask:':'When:')+'</b> '+
          esc(REGBY==='when'?g.who:WHEN_LABEL[g.when])+'</div>'+
        '<div class="meta"><b>Blocks:</b> '+hi(g.blocks)+'</div></div>';
   });
   h+='</div>';
 });
 return h;
}

/* ============ render ============ */
function draw(){
 drawStats(); drawNav();
 var v=document.getElementById('view');
 if(OPEN){
   var s=SOPS.filter(function(x){return x.id===OPEN;})[0];
   if(s){ v.innerHTML=detail(s);
     var bk=document.getElementById('bk');
     if(bk) bk.onclick=function(){ OPEN=null; draw(); window.scrollTo(0,0); };
     return; }
   OPEN=null;
 }
 if(SEC==='__gaps'){
   v.innerHTML=gapsView();
   v.querySelectorAll('[data-by]').forEach(function(b){
     b.onclick=function(){ REGBY=b.dataset.by; draw(); };
   });
   var cq=document.getElementById('copyq');
   if(cq) cq.onclick=function(){
     var gs=allGaps(), by={};
     gs.forEach(function(g){ (by[REGBY==='when'?g.when:g.who]=by[REGBY==='when'?g.when:g.who]||[]).push(g); });
     var keys=Object.keys(by);
     if(REGBY==='when') keys.sort(function(a,b){return WHEN_ORDER[a]-WHEN_ORDER[b];});
     var out='QUESTIONS TO ASK\n\n';
     keys.forEach(function(k){
       out+=(REGBY==='when'?WHEN_LABEL[k]:k).toUpperCase()+'\n';
       by[k].forEach(function(g,i){
         out+='  '+(i+1)+'. '+g.q+'\n     ask: '+g.who+'   needed for '+g.sid+', '+g.st+'\n'; });
       out+='\n';
     });
     document.getElementById('copyarea').innerHTML='<textarea class="copyout" readonly></textarea>';
     var ta=document.querySelector('.copyout'); ta.value=out; ta.focus(); ta.select();
     try{document.execCommand('copy');}catch(e){}
   };
   var pq=document.getElementById('printq'); if(pq) pq.onclick=function(){window.print();};
   v.querySelectorAll('[data-goto]').forEach(function(t){
     t.onclick=function(){ OPEN=t.dataset.goto; draw(); window.scrollTo(0,0); };
   });
   return;
 }
 var items, head;
 if(SEC==='__all'){ items=SOPS.filter(matches);
   head='<div class="sechead"><h2>Every procedure</h2><p>All '+SOPS.length+' in one list, in order.</p></div>'; }
 else { items=inSec(SEC); var sd=SOP_SECTIONS.filter(function(x){return x.k===SEC;})[0];
   head='<div class="sechead"><h2>'+esc(sd.n)+'</h2><p>'+esc(sd.note)+'</p></div>'; }
 v.innerHTML=head+listRows(items);
 v.querySelectorAll('.row').forEach(function(r){
   r.onclick=function(){ OPEN=r.dataset.id; draw(); window.scrollTo(0,0); };
 });
}

document.getElementById('q').addEventListener('input',function(e){
 QRY=e.target.value.trim();
 if(QRY && OPEN) OPEN=null;
 draw();
});
draw();
</script>
</body>

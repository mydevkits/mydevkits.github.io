<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standard Operating Procedures</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#f6f7f9; --panel:#fff; --ink:#131c25; --mid:#5a6572; --line:#e2e6ea;
 --accent:#0b5cab; --accentbg:#eaf2fb;
 --ready:#1a7f4b; --readybg:#e7f5ed;
 --gap:#9a6a00; --gapbg:#fdf3dd;
 --blocked:#a52929; --blockedbg:#fbeaea;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ---------- top bar ---------- */
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hwrap{max-width:1180px;margin:0 auto;padding:14px 20px}
.htop{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:19px;font-weight:650;letter-spacing:-.2px}
.sub{color:var(--mid);font-size:13px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stat{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);background:#fafbfc;color:var(--mid)}
.stat b{color:var(--ink);font-weight:650}
.stat.r{background:var(--readybg);border-color:#bfe3ce;color:var(--ready)}
.stat.g{background:var(--gapbg);border-color:#ecd9a4;color:var(--gap)}
.stat.b{background:var(--blockedbg);border-color:#eec4c4;color:var(--blocked)}
#q{width:100%;margin-top:12px;padding:10px 13px;font-size:15px;border:1px solid var(--line);
 border-radius:8px;background:#fafbfc;font-family:inherit}
#q:focus{outline:none;border-color:var(--accent);background:#fff}

/* ---------- layout ---------- */
.main{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
@media(max-width:840px){.main{grid-template-columns:1fr;padding:14px}}
nav{position:sticky;top:150px}
@media(max-width:840px){nav{position:static}}
.navbtn{display:block;width:100%;text-align:left;background:none;border:none;font:inherit;cursor:pointer;
 padding:8px 11px;border-radius:7px;color:var(--mid);line-height:1.3;margin-bottom:1px}
.navbtn:hover{background:#edf0f3;color:var(--ink)}
.navbtn.on{background:var(--accentbg);color:var(--accent);font-weight:600}
.navbtn .n{float:right;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.navsep{height:1px;background:var(--line);margin:9px 4px}
.navlbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#94a0ac;padding:0 11px;margin:12px 0 5px}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:11px}
.sechead{margin-bottom:14px}
.sechead h2{font-size:17px;font-weight:650}
.sechead p{color:var(--mid);font-size:13.5px;margin-top:3px}
.row{padding:13px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.row:hover{background:#fafbfc}
.row .sid{font:12px var(--mono);color:var(--mid);flex:none;padding-top:2px;width:62px}
.row .rt{flex:1;min-width:0}
.row .rt h3{font-size:15px;font-weight:600;line-height:1.35}
.row .rt p{color:var(--mid);font-size:13px;margin-top:2px}
.pill{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.5px;
 padding:2px 7px;border-radius:4px;flex:none;margin-top:2px}
.p-ready{background:var(--readybg);color:var(--ready)}
.p-gap{background:var(--gapbg);color:var(--gap)}
.p-blocked{background:var(--blockedbg);color:var(--blocked)}

/* ---------- detail ---------- */
.back{background:none;border:none;font:inherit;color:var(--accent);cursor:pointer;padding:0;margin-bottom:12px;font-size:13.5px}
.det{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px 26px}
@media(max-width:840px){.det{padding:17px}}
.det h2{font-size:21px;font-weight:650;line-height:1.3;letter-spacing:-.2px}
.gov{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:16px 0 20px}
.gov div{background:#fafbfc;padding:8px 11px}
.gov dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#94a0ac;margin-bottom:2px}
.gov dd{font-size:13px;font-weight:550}
.blk{margin-bottom:18px}
.blk>h4{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#94a0ac;margin-bottom:7px}
.blk p{font-size:14.5px}
.why{background:#fafbfc;border-left:3px solid var(--accent);padding:11px 14px;border-radius:0 6px 6px 0;font-size:14px}
ol.steps{list-style:none;counter-reset:s}
ol.steps>li{counter-increment:s;position:relative;padding:0 0 16px 40px;margin-bottom:16px;border-bottom:1px solid var(--line)}
ol.steps>li:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;
 background:var(--accentbg);color:var(--accent);font-size:12.5px;font-weight:650;display:flex;align-items:center;justify-content:center}
ol.steps h5{font-size:15px;font-weight:600;line-height:1.35}
ol.steps p{font-size:14px;color:#33414f;margin-top:4px}
.where{margin-top:7px;font-size:13px;background:#f2f5f8;border-radius:6px;padding:7px 10px;color:#2c3a47}
.where b{font-weight:650;color:var(--accent)}
.gapflag{margin-top:7px;font-size:12.5px;background:var(--gapbg);border-radius:6px;padding:6px 10px;color:var(--gap);font-weight:550}
.chk{margin-top:8px;list-style:none}
.chk li{font-size:13.5px;color:#3d4a57;padding-left:22px;position:relative;margin-top:3px}
.chk li::before{content:"";position:absolute;left:0;top:3px;width:13px;height:13px;border:1.5px solid #b6c0ca;border-radius:3px}
.donebox{background:var(--readybg);border:1px solid #bfe3ce;border-radius:8px;padding:12px 15px}
.donebox h4{color:var(--ready)}
.donebox .chk li::before{border-color:#7cbf9b}
.fail{border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:7px;font-size:14px}
.fail b{display:block;color:var(--blocked);font-weight:650;margin-bottom:3px}
.say{background:#fffdf5;border:1px solid #ecdfb8;border-radius:8px;padding:12px 15px;font-size:14px;font-style:italic;color:#4a3f22}
.gapbox{background:var(--gapbg);border:1px solid #ecd9a4;border-radius:8px;padding:13px 16px}
.gapbox h4{color:var(--gap)}
.gapitem{padding:9px 0;border-bottom:1px dashed #ddc994}
.gapitem:last-child{border-bottom:none;padding-bottom:0}
.gapitem .qq{font-size:14px;font-weight:600;color:#6b4a00}
.gapitem .mm{font-size:12.5px;color:#8a6a1f;margin-top:3px}
.gapitem .mm b{font-weight:650}
.rel{display:inline-block;font-size:12.5px;background:var(--accentbg);color:var(--accent);border-radius:5px;
 padding:3px 8px;margin:2px 4px 2px 0;cursor:pointer;border:none;font-family:inherit}

/* ---------- gaps register ---------- */
.regbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.btn{font:inherit;font-size:13px;padding:7px 13px;border-radius:7px;border:1px solid var(--line);
 background:#fff;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f2f5f8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#094c8e}
.who{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:11px;overflow:hidden}
.who>h3{font-size:14.5px;font-weight:650;padding:11px 16px;background:#fafbfc;border-bottom:1px solid var(--line)}
.who>h3 span{float:right;font-size:12px;color:var(--mid);font-weight:500}
.qrow{padding:12px 16px;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:none}
.qrow .qq{font-size:14.5px;line-height:1.45}
.qrow .meta{font-size:12.5px;color:var(--mid);margin-top:4px}
.qrow .meta .tag{font:11.5px var(--mono);background:#f2f5f8;padding:1px 6px;border-radius:4px;margin-right:6px;cursor:pointer}
.empty{color:var(--mid);padding:26px;text-align:center;font-size:14px}
textarea.copyout{width:100%;height:220px;font:12.5px/1.5 var(--mono);border:1px solid var(--line);
 border-radius:8px;padding:12px;margin-top:10px;background:#fafbfc}
mark{background:#ffe9a8;color:inherit;border-radius:2px}

@media print{
 header,nav,.regbar,.back{display:none}
 .main{display:block;max-width:none;padding:0}
 .det,.card,.who{border:none;page-break-inside:avoid}
 body{background:#fff}
}
</style>
</head>
<body>

<header><div class="hwrap">
 <div class="htop">
   <h1>Standard Operating Procedures</h1>
   <span class="sub">Customer Support, VoIP. Dental Intelligence.</span>
 </div>
 <div class="stats" id="stats"></div>
 <input id="q" type="search" placeholder="Search procedures, steps, and open questions" autocomplete="off">
</div></header>

<div class="main">
 <nav id="nav"></nav>
 <div id="view"></div>
</div>

<script>/* ============================================================
   STANDARD OPERATING PROCEDURES
   Dental Intelligence, Customer Support VoIP team

   status values
     ready   we know enough to follow this today
     gap     usable, but one or more details are unknown
     blocked we cannot follow this at all until someone tells us something

   Every gap carries the exact question to ask and who to ask it.
   ============================================================ */

var SOP_SECTIONS=[
 {k:"how",   n:"Document control",             note:"How a procedure gets changed, and who is allowed to publish it."},
 {k:"access",n:"Access and accounts",          note:"Every system you need a login for, and how to get one."},
 {k:"shift", n:"Shift operations",             note:"Clock in, clock out, breaks, handoff, calling out, on call."},
 {k:"queue", n:"Queue, tickets and escalation",note:"How work arrives, how it is prioritized, and when it leaves your hands."},
 {k:"comms", n:"Customer communication",       note:"Phone, written, and what to say when it is going badly."},
 {k:"port",  n:"Numbers and porting",          note:"Every number job, start to finish. Generated from the same source as the Step By Step tool."},
 {k:"hw",    n:"Phones and hardware",          note:"Specifying, ordering, provisioning and replacing physical phones. Full detail lives in the Phones and Logistics tool."},
 {k:"cross", n:"Working with other teams",      note:"Sales, logistics, and application support. Where the handoffs are and where they break."},
 {k:"stage", n:"Staging and cutover",           note:"Building and proving the system on temporary numbers before the real ones move."},
 {k:"e911",  n:"Emergency calling",            note:"The one that cannot be got wrong."},
 {k:"comp",  n:"Patient and payment information",note:"HIPAA and PCI, in the parts this team actually touches. Named in the job description as ours to uphold."},
 {k:"inc",   n:"Incidents and outages",        note:"Severity, notification, updates, and what happens afterwards."},
 {k:"lead",  n:"Team lead procedures",         note:"Running the team, not doing the tickets."},
 {k:"hr",    n:"HR owned, not ours",           note:"Named here so nothing looks forgotten. Owned by People Operations."}
];

var SOPS=[

/* ================= 000 HOW THIS MANUAL WORKS ================= */
{
 id:"SOP-003", sec:"how", status:"ready", ver:"1.0", owner:"VoIP Support Team Lead",
 title:"Change a procedure in this manual",
 trigger:"Someone finds a step that is wrong, missing, or out of date.",
 who:"Anyone can raise. Only the owner publishes.",
 timing:"Same day to raise. Publish within the week.",
 why:"Uncontrolled edits are how two people end up following two different versions of the same job. A change process is not bureaucracy, it is the thing that lets you trust the page you did not write.",
 steps:[
  {t:"Raise it in writing, with the specific step",
   d:"Not the procedure is wrong. The step, what you expected, and what actually happened. The owner cannot act on a general complaint."},
  {t:"Owner decides: correction or rewrite",
   d:"A correction fixes a detail and bumps the minor version. A rewrite means the job actually changed, which bumps the major version and needs a note to the team, because people who learned the old way will keep doing the old way."},
  {t:"Update the version, the last reviewed date, and the change note",
   d:"The change note is one line saying what changed and why. Six months later that line is the only thing that explains why the procedure looks odd."},
  {t:"Tell the team, and say what to unlearn",
   d:"A quiet update to a page nobody rereads changes nothing. Name the old behavior explicitly so people know to stop."},
  {t:"If the change came from a carrier or a portal changing, check the neighbors",
   d:"Portals rarely change one thing. If Bandwidth moved a menu, every procedure that names that menu is now wrong."}
 ],
 done:["Version bumped","Last reviewed date updated","Change note written","Team told, including what to stop doing"],
 fails:[{if:"Two people disagree about what the correct procedure is",then:"That is not a documentation problem, it is an unmade decision. Escalate it to whoever owns the outcome and let them decide, then write down the decision."}]
},

/* ================= 1200 PATIENT AND PAYMENT INFORMATION ================= */
{
 id:"SOP-1201", sec:"comp", status:"gap", ver:"0.3", owner:"VoIP Support Team Lead",
 title:"Keep patient information out of tickets, chats and vendor escalations",
 trigger:"Any contact where a practice sends, or offers to send, something containing patient details.",
 who:"Everyone on the team, every ticket",
 timing:"Continuous. This is a habit, not a step.",
 why:"Our customers are healthcare providers, so the information moving through a phone system is patient information. Dental Intelligence signs a business associate agreement with each practice, published at dentalintel.com/terms/baa, which commits the company to safeguarding that information, to reporting anything that goes wrong, and to holding anyone it subcontracts to the same standard. A support ticket is one of the easiest places for that commitment to be broken by accident, by somebody being helpful.",
 steps:[
  {t:"Know what carries patient information in our world",
   d:"It is not only the obvious. A voicemail recording, where a patient says their name and why they are calling. A call recording. A text message thread with a patient. A fax that has been moved to email. A screenshot of the schedule or the call log, where a patient's number sits next to an appointment. Any of these in a ticket is the same problem."},
  {t:"Ask for the least you need, which is almost always two numbers and a time",
   d:"Nearly every voice fault can be diagnosed from the calling number, the called number, and the time with the time zone. You very rarely need to know who the patient was or why they rang. Asking narrowly is both faster and safer."},
  {t:"If a practice has already sent it, do not forward it onward",
   d:"They sent it in good faith. Note in the ticket that material was received and is not being reproduced, work from it, and do not paste, quote or attach it into a chat, an email or another ticket."},
  {t:"Be most careful at the vendor escalation, because that is where it leaves the company",
   d:"Sending a recording to DialStack or Bandwidth to prove a fault is the single most likely moment for patient information to go outside. Send the call detail, not the audio. If a vendor genuinely needs a recording, that is a compliance decision before it is a technical one.",
   gap:true},
  {t:"When the question turns legal rather than technical, route it",
   d:"What a practice is permitted to send to patients, what they must retain, what they must disclose. Being helpful with an answer you are not qualified to give is the worst outcome available."}
 ],
 done:["No patient detail in the ticket body, the chat, or any attachment",
       "The ticket records what was received without reproducing it",
       "Anything sent to a vendor contains call records rather than content"],
 fails:[{if:"Patient information has already been pasted into a ticket or sent to a vendor",
         then:"Do not quietly delete it and move on. Deleting it destroys the record of what happened and the reporting clock has probably already started. Tell the lead immediately and follow SOP-1204."}],
 gaps:[{q:"Does our business associate agreement cover recordings and voicemail held on the phone platform, and does DialStack sign one with us as a subcontractor?",who:"Director of Security and Compliance",blocks:"Whether audio can be handled at all, and by whom"},
       {q:"Is there an approved way to send audio to a vendor when a fault genuinely cannot be proven without it?",who:"Director of Security and Compliance",blocks:"Every escalation involving call quality"},
       {q:"What is the internal reporting path and the deadline when patient information is exposed?",who:"Director of Security and Compliance",blocks:"Whether we would meet the notification window"}]
},

{
 id:"SOP-1202", sec:"comp", status:"gap", ver:"0.3", owner:"VoIP Support Team Lead",
 title:"Card payment details on a recorded call or a voicemail",
 trigger:"A practice takes card payments over the phone, or asks about call recording, or a card number turns up somewhere it should not be.",
 who:"Everyone on the team. The lead owns the configuration decision.",
 timing:"Decided before recording is switched on, never after.",
 why:"Dental practices take card payments over the phone, and Dental Intelligence sells a payments product and text to pay, so card details are in this environment by design rather than by accident. The moment a call is recorded and a patient reads a card number aloud, that recording contains cardholder data and the place it is stored becomes something with rules attached. This is the specific combination the job description names when it asks this role to uphold PCI and HIPAA handling standards for call recording.",
 steps:[
  {t:"Understand why the recording is the problem, not the call",
   d:"Taking a card number over the phone is ordinary and allowed. Keeping a recording of it is the part that creates the obligation, because a recording is storage. The sharpest rule concerns the short security code on the back of the card: that number must not be kept once the payment has gone through, and a saved recording keeps it."},
  {t:"Treat recording plus phone payments as a question to answer before it is switched on",
   d:"If a practice takes cards on the phone and wants their calls recorded, somebody has to decide how those two things coexist. That decision belongs with compliance, and it belongs before the feature is enabled, because a recording made today does not become allowed later.",
   gap:true},
  {t:"Know the two answers that are normally acceptable",
   d:"Either the recording pauses around the payment, so the card is never captured, or card details are simply not taken on a recorded line. Which of these our platform can actually do is something we need to establish with DialStack.",
   gap:true},
  {t:"Know the answer that avoids the problem entirely, because we already sell it",
   d:"Text to pay. The practice sends a payment link by text and the patient enters the card on a payment page on their own phone. The number is never spoken, so it never reaches the call, so it never reaches the recording. When a practice asks how to handle card payments safely, this is the useful thing to tell them."},
  {t:"Remember voicemail, which nobody chooses",
   d:"A patient leaves a card number on a voicemail. Nobody configured that and nobody wanted it, and it lands in a mailbox anyway. If voicemail is transcribed and emailed, the card number is then sitting in email. Flag it to the practice and to compliance rather than handling it yourself.",
   gap:true},
  {t:"Card numbers never go in a ticket, on exactly the same rule as patient information",
   d:"If a practice sends you a screenshot showing a card number, do not reproduce it. Note that it was received and route it."}
 ],
 done:["The practice's position on phone card payments is known before recording is enabled",
       "No card number appears in a ticket, a chat or an email",
       "Anything found in a recording or a voicemail is escalated rather than handled locally"],
 fails:[{if:"A recording is found to contain a card number",
         then:"Do not delete it on your own initiative and do not download a copy. Tell the lead the same day and follow SOP-1204. Who is permitted to remove it, and how, is a compliance decision."},
        {if:"A practice asks us to enable recording and also takes cards on the phone",
         then:"Do not enable it and resolve the ticket. Raise it as the compliance question it is, and give them text to pay as the interim answer."}],
 gaps:[{q:"Is this company in PCI scope for voice, and does the phone platform store recordings in a way that puts them in scope?",who:"Director of Security and Compliance",blocks:"Whether call recording can be offered at all"},
       {q:"Can DialStack pause and resume recording around a payment, either automatically or on demand?",who:"DialStack",blocks:"Whether recording and phone payments can coexist"},
       {q:"How long are recordings and voicemails retained, and who is able to listen to them?",who:"Director of Security and Compliance, with DialStack",blocks:"Both the PCI and the patient information positions"},
       {q:"Does voicemail transcription email the transcript, and to what address?",who:"DialStack",blocks:"Whether patient and card details are reaching email automatically"}]
},

{
 id:"SOP-1203", sec:"comp", status:"gap", ver:"0.2", owner:"VoIP Support Team Lead",
 title:"Verify who you are talking to before discussing an account or changing it",
 trigger:"Any inbound contact asking about an account, or asking for a change.",
 who:"Everyone on the team",
 timing:"Before the first account detail leaves your mouth.",
 why:"Changing where a phone number rings is one of the most damaging things that can be done to a practice, and it can be requested by anybody who knows the practice name. On a healthcare customer, discussing the account with the wrong person is a bigger problem than a slow answer.",
 steps:[
  {t:"Establish the caller against the account before you confirm anything about it",
   d:"Including confirming that an account exists. A caller who has guessed wrong should not learn from us that they guessed right.",
   gap:true},
  {t:"Treat routing changes and porting requests as the high risk ones",
   d:"Anything that changes where calls arrive, or who controls a number, deserves more than a name and a practice. These are the requests worth slowing down."},
  {t:"When somebody cannot be verified, say what they can do rather than what they cannot",
   d:"Refusing without a route forward turns a security step into a bad experience. Tell them who at their practice can authorize it."}
 ],
 done:["Caller verified against the account before any detail is confirmed",
       "Verification noted in the ticket",
       "Any change request from an unverified caller is routed rather than refused flatly"],
 fails:[{if:"A change was made for somebody who turns out not to have been authorized",then:"Treat it as an exposure and follow SOP-1204, then reverse the change."}],
 gaps:[{q:"What is the identity verification standard, and is there an authorized contact list per practice we can check against?",who:"Manager, with Security and Compliance",blocks:"Every inbound contact. This is the largest single unknown in this section."}]
},

{
 id:"SOP-1204", sec:"comp", status:"gap", ver:"0.2", owner:"VoIP Support Team Lead",
 title:"When patient or card information has been exposed",
 trigger:"Any suspicion that patient or card information has gone somewhere it should not have.",
 who:"Whoever notices, then the lead immediately",
 timing:"Same hour. There is a reporting clock and it starts when the company knows, not when somebody gets around to saying so.",
 why:"Every obligation in this section has a notification requirement attached, and the business associate agreement commits the company to reporting within a defined window. The failure mode is never the original mistake. It is the delay between somebody noticing and somebody senior being told.",
 steps:[
  {t:"Stop, and change nothing",
   d:"Do not delete the ticket, the message, the recording or the email. Deleting it removes the evidence of what was exposed and to whom, which is exactly what the people handling it need."},
  {t:"Tell the lead the same hour, and the lead tells Security and Compliance",
   d:"Not at the end of the day and not in the next stand up. Somebody being embarrassed is not a reason to wait, and it is worth saying out loud to the team that reporting quickly is the behavior that gets praised.",
   gap:true},
  {t:"Write down what you know, plainly",
   d:"What was exposed, where it went, when, and who might have seen it. Do not investigate further on your own and do not contact the customer about it until you are told to."},
  {t:"Let compliance decide what the practice is told",
   d:"Notification to a customer about their patients' information is a legal act, not a support update. It is not ours to improvise."}
 ],
 done:["Nothing deleted","Lead told within the hour","A written account of what happened exists","No customer contact made without direction"],
 fails:[{if:"Somebody realizes days later that something was exposed earlier",then:"Report it anyway, immediately. Late is far better than never and the clock argument only gets worse."}],
 gaps:[{q:"Who exactly is told, by what route, and within what deadline?",who:"Director of Security and Compliance",blocks:"Whether this procedure can be followed at all"},
       {q:"Is there an incident form or system, or is this an email?",who:"Director of Security and Compliance",blocks:"The mechanics of every report"}]
},

{
 id:"SOP-1205", sec:"comp", status:"blocked", ver:"0.1", owner:"VoIP Support Team Lead",
 title:"Enable call recording for a practice",
 trigger:"A practice asks for their calls to be recorded.",
 who:"Team lead, with compliance",
 timing:"Not a same day request. Treat it as a decision.",
 why:"Recording is the feature that turns ordinary support work into regulated work. It touches consent law, which varies by state, patient information, and card data all at once. It is written here as blocked rather than left out, because leaving it out is how it ends up being switched on by whoever was asked first.",
 steps:[
  {t:"Confirm the company position before anything is enabled",
   d:"Whether recording is offered at all, and on what terms.",gap:true},
  {t:"Establish the consent obligation for the states the practice operates in",
   d:"Some states require every party to a call to consent. This is a legal question and it is routed, never answered from general knowledge.",gap:true},
  {t:"Ask whether the practice takes card payments over the phone",
   d:"If yes, SOP-1202 applies and this becomes a compliance decision rather than a configuration task."},
  {t:"Establish retention and access before go live",
   d:"How long recordings are kept, who can play them, and how they are deleted.",gap:true},
  {t:"Confirm whether recordings can be used for our own quality review",

 ],

{
 id:"SOP-202", sec:"shift", status:"gap", ver:"0.4", owner:"VoIP Support Team Lead",
 title:"Version 2: a salaried team working flexibly",
 trigger:"Use this version only if SOP-200 established that the team is salaried with no clocking.",
 who:"Every team member, if this model applies",
 timing:"Ongoing",
 why:"On a salaried team nobody is counting hours and nobody should be. What still has to be true is that practices can reach somebody, that work does not stall because the person holding it is unavailable, and that nobody has to guess where anybody is. Those are coverage problems, not attendance problems, and they are solved by communication rather than by rules.",

   d:"Same as the other version. Headset, softphone, ticketing, chat, and knowing where things live. Set up once, working every day after."},

{
 id:"SOP-204", sec:"shift", status:"gap", ver:"0.4", owner:"VoIP Support Team Lead",
 title:"Hand over at the end of a shift",
 trigger:"End of every shift where somebody else picks up after you.",
 who:"Outgoing and incoming team member",
 timing:"Five minutes to write. Two minutes to read.",
 why:"Most support failures that look dramatic are actually a handover that did not happen. This is the cheapest reliability improvement available to a support team and it costs five minutes.",
 note:"This is about the queue, not about porting. Porting work is not handed over shift to shift. See the ownership rule in the first step.",
 steps:[
  {t:"Know what is not handed over: a port belongs to one person until it goes live",
   d:"Each port is assigned to a rep and that rep works it through to live. Collection, submission, chasing the carrier, the rejection if there is one, the cutover, and the days afterwards. It does not move between people at the end of a shift, and there should be no situation where somebody picks up a stranger's port order from a note. The customer talks to one person throughout and that person knows the history without reading it.",
   pri:true},
  {t:"The one exception is planned or unplanned leave",
   d:"If somebody is out, their accounts get named cover, and that is exactly when detailed notes matter. Cover means a specific person, not the queue in general. Hand the accounts over person to person, not by leaving a document behind, and tell the customer who they are speaking to while their usual contact is away."},
  {t:"For everything else, write it in the same place every time",
   d:"A channel, a shared doc, a pinned message. It does not matter which, it matters that it never moves, because a handover somebody has to hunt for is a handover nobody reads.",
   gap:true},
  {t:"Lead with anything time critical in the next twelve hours",
   d:"A cutover, a port date, a practice that is currently down, a promised callback with a time on it. If the incoming person reads only the first three lines, these are the lines."},
  {t:"Then anything open and waiting",
   d:"Ticket number, practice name, what state it is in, and specifically who is waiting on whom. Waiting on the carrier is a completely different situation from waiting on us."},
  {t:"Then anything unusual",
   d:"A pattern you noticed, three practices with the same symptom, a portal behaving oddly. This is how a widespread problem gets caught on day one instead of day four."},
  {t:"Name the things you promised",
   d:"If you told a practice you would call them back by ten, that promise now belongs to whoever is on at ten. Say so explicitly."},
  {t:"For an incident, hand over live rather than in writing",
   d:"Talk to the person. Have them repeat the state back to you. Written handover for a live incident loses the half of the picture that is in your head."}
 ],

       "Time critical items first",
       "Every promise with a time attached is named",
       "Incoming person has acknowledged it"],

/* ================= 300 QUEUE, TICKETS, ESCALATION ================= */
{

 title:"Pick up and triage an incoming request",
 trigger:"A ticket, call, or chat arrives.",
 who:"Every team member",
 timing:"Triage in the first two minutes",
 why:"Triage is deciding what kind of problem this is before you start solving it. Skipping it is how somebody spends forty minutes on a voicemail setting while a practice with no emergency calling waits behind them.",
 steps:[
  {t:"Identify the practice and confirm you are talking to somebody authorized",
   d:"Especially before you change anything or discuss account details. Getting this wrong on a healthcare customer is a bigger problem than a slow answer.",
   gap:true},
  {t:"Ask the routing question first",
   d:"Is this calls, texting, or the practice software. Thirty seconds here saves you looking in the wrong system. See SOP-104."},
  {t:"Check emergency calling before anything else",
   d:"If the practice cannot make calls at all, tell them to use mobiles for emergencies until we confirm the line is working. Do not ask them to test it by dialing 911 and do not do so yourself. If a verification is needed, 933 is the test line and it reads the registered address back to you. This comes before diagnosis, before apologies, before everything."},
  {t:"Decide the severity",
   d:"Whole practice down, one function down, one user affected, or a question. That single judgement drives everything that follows."},
  {t:"Set expectations out loud",
   d:"Tell them what you are going to do and roughly how long before they hear from you. An unbounded wait feels far longer than a bounded one."},
  {t:"Write it down as you go, not afterwards",
   d:"Practice, symptom, exact numbers involved, exact time with the time zone, and what you have already ruled out. If this escalates later, this is the difference between a fast fix and a day of back and forth."}
 ],
 done:["Caller verified",
       "System identified",
       "Emergency calling checked when calls are affected",
       "Severity set",
       "Expectation given with a time",
       "Ticket written with specifics rather than descriptions"],
 fails:[{if:"You have been genuinely troubleshooting for around an hour and are not closing in on it",then:"Ask somebody to look with you. Not a handover, a second opinion. Fifteen minutes is not long enough to have tried anything, and escalating everything early is its own failure: it teaches the team not to think and it buries whoever is second line."},
        {if:"You are stuck and it is a whole practice down",then:"Different rule. Do not sit on that for an hour. Get help as soon as you have established the basics and confirmed emergency calling."}],
 gaps:[{q:"What is the identity verification standard before we discuss an account or make a change? Is there a defined authorized contact list per practice?",who:"Manager, and possibly compliance",blocks:"Whether we are handling healthcare customer data correctly"},
       {q:"What are the actual severity definitions and target response times we commit to?",who:"Manager",blocks:"SOP-302 and any reporting on whether we are meeting them"},
       {q:"How are tickets assigned? Do people pull from a queue, or are they pushed?",who:"Manager",blocks:"How I balance workload and spot somebody drowning"},
       {q:"Is there a required ticket template or set of mandatory fields?",who:"Manager",blocks:"Standardizing documentation quality"}]

{
 id:"SOP-302", sec:"queue", status:"gap", ver:"0.4", owner:"VoIP Support Team Lead",
 title:"Escalate a ticket",
 trigger:"You have hit the limit of what you can do, or a time threshold has passed.",
 who:"Every team member",
 timing:"Earlier than feels comfortable",
 why:"Escalation is not an admission of failure, it is a routing decision. The real failure is holding a ticket for two hours out of pride while a practice loses patients.",
 steps:[
  {t:"Know your triggers before you are in it",
   d:"Escalate when emergency calling is affected, when a whole practice is down and the cause is not becoming clear, when a port order has been rejected twice, when a carrier will not move and a committed date is at risk, or when a customer asks for a manager. Two rejections in a row is a process failure rather than bad luck, and a third attempt is unlikely to be different.",
   pri:true},
  {t:"Escalate on the situation, not on the clock",
   d:"There is no minute count that means escalate. A single user problem can sit with you for a couple of hours while you work it properly. A practice with no phones cannot sit with you for twenty minutes. As a rough guide, if you have genuinely been working a problem for about an hour and are not closing in, bring in a second pair of eyes. Do not escalate everything early, because a queue where everything escalates is a queue that has stopped solving anything."},
  {t:"Escalate with evidence, not with a description",
   d:"An exact failing call, the numbers involved on both ends, the time with the time zone, what you have already ruled out, and what you need from them. A vague escalation gets a request for details and costs an hour."},
  {t:"Say what you have already tried",
   d:"Otherwise the next person repeats your first thirty minutes in front of the same customer."},
  {t:"Name what you actually want",
   d:"A decision, a permission you do not have, a carrier escalation, or a second opinion. Escalations that do not say what they want sit still."},
  {t:"Stay the point of contact for the customer unless you formally hand that over too",
   d:"The worst outcome is a customer who has been escalated and now hears from nobody, because each person assumes the other has it."},
  {t:"Know the path",
   d:"Who is second line, whether that is inside the company or at DialStack or Bandwidth, and how long each hop should take.",
   gap:true}
 ],
 done:["Escalated to the right place with evidence attached",
       "The ask is stated explicitly",
       "The customer knows it has been escalated and who is talking to them",
       "The ticket says who owns it now"],
 fails:[{if:"The escalation goes silent",then:"Chase on your own schedule rather than the customer's. If you promised an update at two, you update at two whether or not you have news."}],
 gaps:[{q:"What is the escalation path? Who is second line, and at what point does something go to DialStack or to Bandwidth rather than staying internal?",who:"Manager",blocks:"This procedure, and it is one of the first things I need in the seat"},
       {q:"What response times do we commit to at each severity, and are they contractual?",who:"Manager",blocks:"Whether escalation triggers are based on real commitments or on my judgement"},
       {q:"Who has authority to approve a goodwill credit or a concession, and up to what value?",who:"Manager",blocks:"What I can offer a practice that has genuinely been let down"}]
},

{
 id:"SOP-303", sec:"queue", status:"ready", ver:"1.0", owner:"VoIP Support Team Lead",
 title:"Write a ticket somebody else can pick up",
 trigger:"Every ticket, every time you touch it.",
 who:"Every team member",
 timing:"As you go, not at the end of the day",
 why:"Every ticket will eventually be read by somebody who was not there. Documentation quality is the single biggest lever on how fast a second person can help, and it costs nothing extra if you do it while you work.",
 steps:[
  {t:"Record specifics, never descriptions",
   d:"Not calls are failing. The call from this number to that number at 9:42 Mountain time failed with this behavior. Every system anybody escalates to will ask for exactly that, so capturing it first time saves a round trip."},
  {t:"Say what you ruled out and how",
   d:"Ruling something out is real work and it is invisible unless you write it. Otherwise the next person redoes it."},
  {t:"Separate what the customer said from what you observed",
   d:"They are often different, and knowing which is which matters when the story changes on day three."},
  {t:"State who is waiting on whom, in the next action",
   d:"Waiting on the carrier, waiting on the customer to sign, waiting on us. This one line is what makes a queue reviewable at a glance."},
  {t:"Put dates on promises",
   d:"Called and left a message is not a next action. Called and left a message, will try again Thursday morning, is."},
  {t:"Write it so the customer could read it",
   d:"Not because they will, but because it keeps the tone factual, and occasionally they do."}
 ],
 done:["Exact numbers and times captured with time zone",
       "What was ruled out is written down",
       "Next action names who is waiting on whom",
       "Any promise has a date on it"],
 fails:[{if:"You are updating tickets from memory at the end of the day",then:"That is the habit to break. Detail decays within the hour, and the details that decay first are exactly the ones an escalation needs."}]
},

{
 id:"SOP-304", sec:"queue", status:"gap", ver:"0.3", owner:"VoIP Support Team Lead",
 title:"Close a ticket",
 trigger:"The problem appears to be solved.",
 who:"Every team member",
 timing:"Not before it is confirmed",

  {t:"Check whether the fix broke a neighbor",
   d:"Especially with numbers. Texting and calling on the same number are separate services and a change to one can affect the other."},
  {t:"Write the resolution in a way that helps the next person",
   d:"The cause, not just the action. Restarted the phone tells nobody anything. The handset had lost its registration after the network change tells the next person where to look."},
  {t:"If it is the third time this practice has raised the same thing, do not just close it",
   d:"Three repeats is a pattern, and the pattern is the actual ticket. Flag it."},
  {t:"Categorize it honestly",
   d:"Category data is what tells you, three months in, that a quarter of your volume is one preventable thing. Miscategorizing to close faster destroys exactly the data a new team needs most.",
   gap:true}
 ],

       "Neighboring service checked",
       "Cause written, not just the action",
       "Categorized honestly"],

 gaps:[{q:"What are the ticket categories, and can I change them? Category quality decides whether trend reporting is possible at all.",who:"Manager or whoever administers the help desk",blocks:"SOP-803 and any useful reporting"},
       {q:"What is the rule for closing a ticket when the customer has gone quiet? How many attempts, over how long?",who:"Manager",blocks:"Consistency across the team"},

/* ================= 400 CUSTOMER COMMUNICATION ================= */
{
 id:"SOP-401", sec:"comms", status:"ready", ver:"1.0", owner:"VoIP Support Team Lead",
 title:"Update a practice during an outage",
 trigger:"A practice is down or degraded and the fix is not immediate.",
 who:"Whoever owns the ticket",
 timing:"Every thirty minutes",
 why:"Silence is what turns a bad morning into a lost customer. A practice can tolerate a long fix. They cannot tolerate not knowing whether anybody is working on it.",
 steps:[
  {t:"Update every thirty minutes whether or not there is news",
   d:"No news is news. Still working on it, here is what we have ruled out, next update at half past. That is a complete and acceptable update."},
  {t:"Say what they can do right now",
   d:"Give them something actionable. Use mobiles for emergency calls. Forward to a mobile if a line is still alive. Anything is better than sit and wait."},
  {t:"Never give a fix time you are not certain of",
   d:"A missed estimate costs more trust than no estimate. Say what you are doing next and when you will next speak, which are both things you control."},
  {t:"Own it without assigning blame",
   d:"The carrier did it is true and useless to a practice with a waiting room. What they need is what is being done and when they will hear next."},
  {t:"Name who is dealing with it",
   d:"A practice that knows there is a specific person on their problem behaves completely differently from one that thinks they are in a queue."},
  {t:"When it is fixed, call, do not email",
   d:"And have them test it while you are on the line."}
 ],
 done:["Updates went out on the half hour throughout",
       "The practice always knew what to do in the meantime",
       "The final confirmation was verbal and tested"],
 fails:[{if:"You have nothing to say at the thirty minute mark",then:"Say that. The update is the point, not the content."}]
},

{
 id:"SOP-402", sec:"comms", status:"ready", ver:"1.0", owner:"VoIP Support Team Lead",
 title:"Deliver bad news to a practice",
 trigger:"A date is slipping, a number cannot move, or something we said would work will not.",
 who:"Whoever owns the relationship, and the lead for anything serious",
 timing:"The moment you know, not the moment you have a solution",
 why:"The instinct is to wait until you have a fix so you can deliver the problem and the answer together. That instinct costs the customer the time they needed to make their own arrangements, and it is the single most damaging habit in support.",
 steps:[
  {t:"Tell them as soon as you know, by phone",
   d:"Email for bad news reads as avoidance, and it removes your ability to answer the question they will immediately have."},
  {t:"Lead with the fact, not the build up",
   d:"Your port has been rejected and the date has moved. Then the reason. A long preamble makes people assume it is worse than it is."},
  {t:"Say what it means for them practically",
   d:"Not the process consequence, the practice consequence. Your old phones keep working, nothing changes today, the new date is this."},
  {t:"Say what you are doing about it and when they will hear next",
   d:"With a specific time. This is the part that decides whether they feel handled or abandoned."},
  {t:"Do not blame the carrier even when it is the carrier",
   d:"To the practice, we chose the carrier. Explaining the cause is useful. Distancing yourself from it is not."},
  {t:"Write it down straight afterwards while it is exact",
   d:"What you told them, what you promised, and when. Especially the date, because that is the thing that gets remembered differently later."}
 ],
 done:["Told by phone, same day you knew",
       "Practical consequence stated in their terms",
       "Next contact time given and met",
       "The conversation logged with the exact commitment"],
 fails:[{if:"You do not yet know how bad it is",then:"Call anyway. Here is what has happened, here is what I do not yet know, here is when I will know more, is a far better call than silence for two days."}]
},

/* ================= 600 EMERGENCY CALLING ================= */
{
 id:"SOP-601", sec:"e911", status:"gap", ver:"0.6", owner:"VoIP Support Team Lead",
 title:"Register an emergency address for every phone",
 trigger:"Any new phone, any moved phone, any new location, any practice going live.",
 who:"Onboarding, checked by the lead",
 timing:"Before the practice goes live. Never after.",
 why:"This is the one that cannot be got wrong. On a traditional line the address is tied to the wire. On a phone service that runs over the internet, the address is whatever somebody typed in, and if nobody typed it in, an emergency call can reach a dispatcher with no idea where to send anybody.",
 steps:[
  {t:"Get a real dispatchable location, not just a street address",
   d:"A dispatchable location is the validated street address plus the detail that gets somebody to the actual room. Suite number, floor, operatory. A large building with one address on file means paramedics arrive at the lobby."},
  {t:"Register an address for every single phone, not one for the practice",
   d:"Handsets move. A phone carried into a different suite keeps the address that was registered to it, not the address of the room it is now in."},
  {t:"Confirm the address came back provisioned",
   d:"Submitted and provisioned are different states. Submitted means we asked. Provisioned means the emergency network accepted it. A submitted address that failed validation looks fine on our side and does nothing in a real emergency.",
   gap:true},
  {t:"Test it by dialing 933, never by dialing 911",
   d:"933 is the emergency address test line. It answers with an automated voice that reads back the address and callback number currently registered against that phone. That is exactly what you need to verify, and it costs a dispatcher nothing. Dial it from the handset itself, not from a softphone on somebody else's account, because the whole point is to confirm what that specific device would send.",
   pri:true},
  {t:"Listen to what it actually reads back, not just that it answered",
   d:"If it reads back a different address, an old address, or nothing at all, the registration has not taken effect regardless of what the platform shows. If it reads back the street but not the suite, that is the failure that puts paramedics in a lobby."},
  {t:"Recheck it whenever anything physical changes",
   d:"A practice adds an operatory, moves a phone, opens a second location, or renumbers their suites. All of those invalidate what is on file and none of them generate a ticket."},
  {t:"Tell the practice, in writing, what their obligation is",
   d:"They have to tell us when a phone moves. They will not know that unless somebody says it, and it is the most likely way this goes wrong quietly."}
 ],
 done:["Every handset has its own address",
       "Every address includes the room level detail",
       "Every address confirmed provisioned rather than merely submitted",
       "933 dialed from each handset and the address it read back verified, including the suite detail",
       "The practice has been told in writing to notify us when a phone moves"],
 fails:[{if:"An address will not validate",then:"Stop. Do not go live on that phone. An unvalidated address is worse than a known gap because it looks complete."},
        {if:"You discover a live practice has phones with no address",then:"Treat it as an incident, not as a task. Tell them to use mobiles for emergencies until it is fixed, and fix it the same day."}],
 gaps:[{q:"Where in DialStack are emergency addresses registered, and how do we see the provisioned status rather than just the submitted status?",who:"DialStack administrator",blocks:"Being able to verify rather than assume"},
       {q:"Is 933 supported end to end on this platform, and does it read back the dispatchable location including suite detail or only the street address?",who:"DialStack or Bandwidth",blocks:"Whether our verification step actually verifies the part that matters"},
       {q:"Does the platform alert us when an emergency call is placed, and does anybody currently monitor that?",who:"DialStack administrator",blocks:"Whether we would know if a practice made an emergency call from an unregistered phone"},
       {q:"Who is legally accountable for dispatchable location accuracy in our arrangement, us, DialStack, or the practice? And what does the customer agreement say?",who:"Manager, and possibly legal",blocks:"Knowing how hard to push a practice that will not give us suite detail"},
       {q:"Is there an audit that checks every live practice has valid addresses, and if not, can I build one?",who:"Manager",blocks:"Finding the practices that are already exposed"}]
},

   d:"Establish whether they can reach emergency services. If not, or if you cannot confirm it, tell them to use mobiles for emergencies right now. Then carry on. This takes ten seconds and it comes before diagnosis."},

  {t:"Write down the timeline as it happens",

{

  {t:"Update the procedure the same week",
   d:"This is the point of the whole exercise. If a procedure did not cover it, it does now, and the change note says which incident caused it."},
  {t:"Feed it into training",
   d:"A real incident makes a far better training scenario than an invented one, because everybody knows it actually happened."}
 ],

/* ================= 800 TEAM LEAD ================= */
{
 id:"SOP-801", sec:"lead", status:"gap", ver:"0.3", owner:"VoIP Support Team Lead",
 title:"Onboard a new team member",
 trigger:"A new hire starts.",
 who:"Lead",
 timing:"Week one intensively, then tapering over the first month",
 why:"On a new team, the first few hires define what normal looks like. Whatever you let happen in week one becomes the standard, and it is much harder to raise later than to set now.",
 steps:[
  {t:"Have every account requested before their start date",
   d:"See SOP-101. This is the most common way a first week gets wasted, and it is entirely preventable by doing it a week early."},
  {t:"Give them a safe place to practice",
   d:"A sandbox. Learning porting on a live customer is how a practice loses a number.",
   gap:true},
  {t:"Have them read this manual, then have them find the holes in it",
   d:"A new person is the only one who can see what is missing, and they lose that ability within a fortnight. Ask them explicitly to log every question they had to ask somebody, and add those to the gaps register."},
  {t:"Listen to real calls before taking any",
   d:"Then take calls with somebody listening. Then take calls alone with somebody available. Three stages, not two."},
  {t:"Set out what good looks like in writing on day one",
   d:"Response expectations, documentation standard, when to escalate. Vague standards get met vaguely."},
  {t:"Check in daily for the first week",
   d:"Short and specific. What did you get stuck on, what did you have to ask somebody, what is still confusing. That last question is the one that surfaces the real gaps."},
  {t:"Give them one owned thing early",
   d:"A small procedure to own, a category of ticket, a report. Ownership creates engagement faster than any amount of shadowing."}
 ],

       "Practice environment available",
       "Three stage call progression completed",
       "Standards stated in writing",
       "Their questions captured into the gaps register"],

       {q:"How long is the ramp expected to be, and is there a defined point where somebody is considered fully productive?",who:"Manager",blocks:"Hiring plans and coverage maths"},
       {q:"Is there a sandbox for training?",who:"Manager",blocks:"Whether new hires learn on live customers"}]

{
 id:"SOP-802", sec:"lead", status:"gap", ver:"0.3", owner:"VoIP Support Team Lead",
 title:"Review calls and tickets for quality",
 trigger:"A regular cadence, plus any escalation or complaint.",
 who:"Lead",
 timing:"Weekly sample, suggested a small number per person",
 why:"Without sampling you only ever see the tickets that went wrong loudly, which is a biased sample. Quality review is how you find the quiet problems, and it is also how coaching becomes specific rather than general.",
 steps:[
  {t:"Agree what you are measuring before you start measuring it",
   d:"Accuracy, documentation quality, escalation timing, tone. Publish it. Being reviewed against unstated criteria is corrosive and people will assume the worst."},
  {t:"Sample rather than inspect everything",
   d:"A small number per person per week, chosen randomly, plus every escalation and every complaint."},
  {t:"Review against the SOP, not against how you would have done it",
   d:"If somebody followed the procedure and got a bad outcome, the procedure is wrong. That is a finding about the manual, not about the person."},
  {t:"Give feedback within days, not at the end of the month",
   d:"Feedback about a call somebody cannot remember is just criticism."},
  {t:"Track themes, not scores",
   d:"One person's number is nearly meaningless. Three people making the same mistake is a training gap or a procedure gap, and that is actionable."},
  {t:"Feed every finding back into the manual or into training",
   d:"Otherwise you are grading rather than improving."}
 ],
 done:["Criteria published before review starts",
       "Sample reviewed weekly",
       "Feedback given within days",
       "Themes tracked and fed back into procedures"],
 gaps:[{q:"Are calls recorded, and are we permitted to use recordings for quality review? Healthcare customers may add constraints.",who:"Manager, and possibly compliance",blocks:"Whether call review is possible at all"},
       {q:"Is there an existing QA framework or scorecard in the company I should align with?",who:"Manager",blocks:"Consistency with how other teams are measured"},
       {q:"How does quality review relate to formal performance review, and is that relationship stated to the team?",who:"People Operations",blocks:"Trust. People need to know whether this is coaching or assessment."}]
},

{
 id:"SOP-803", sec:"lead", status:"gap", ver:"0.4", owner:"VoIP Support Team Lead",
 title:"Track and report on the team from day one",
 trigger:"Starting the team, then weekly and monthly thereafter.",
 who:"Lead",
 timing:"Set it up in week one, before there is any volume",
 why:"This team does not exist yet, so there is no baseline and no average anything. That is not a problem, it is an advantage, but only if measurement starts on day one. Reconstructing three months of history later is impossible, and the first quarter is exactly the period leadership will ask about.",
 steps:[
  {t:"Decide what you are counting before volume arrives",
   d:"Time to first response, time to resolve, port success rate on first submission, rejection reasons by category, cutover success rate, repeat contact rate, and how many practices went live. Pick a small set you will actually maintain."},
  {t:"Instrument the ones that come free",
   d:"Anything the ticketing system already records costs nothing. Start with those and only add manual tracking where the value clearly justifies it."},
  {t:"Track port rejection reasons obsessively",
   d:"This is the single most valuable number for a new porting team. Rejections are preventable, they are categorizable, and the categories tell you exactly which step in the process is weak."},
  {t:"Record the baseline honestly, including how bad it was at the start",
   d:"An unflattering month one is what makes month four meaningful. A tidied up baseline destroys your own evidence of improvement."},
  {t:"Report the trend and the reason, not the number",
   d:"Rejections fell from a third to a tenth because we started collecting the account passcode before submission. That sentence is worth more than any dashboard."},
  {t:"Watch for the metric that changes behavior badly",
   d:"Any speed metric will eventually be met by closing tickets early. Pair every speed metric with a quality one, repeat contact rate being the obvious partner."}
 ],
 done:["Metric set chosen and written down",
       "Baseline recorded from the first week",
       "Rejection reasons categorized from the first port",
       "A regular report going to the manager with reasons attached"],
 fails:[{if:"You have no volume yet",then:"Track the process anyway. Even three ports tell you whether the checklist is working, and the habit is what matters at this stage."}],
 gaps:[{q:"What is already being measured, and what does leadership actually look at? Is there an existing support dashboard?",who:"Manager, first week",blocks:"Whether I duplicate reporting or fill a gap"},
       {q:"What does success look like for this team at ninety days, in leadership's words rather than mine?",who:"Manager, first week",blocks:"Everything. This is arguably the single most important question to ask on day one."},
       {q:"Can I get reporting access to the ticketing system, or do reports come from somebody else?",who:"Manager",blocks:"Whether I can self serve or depend on someone"},
       {q:"How many practices are expected to migrate, over what period? That number decides staffing and whether the process needs to scale.",who:"Manager",blocks:"Capacity planning"}]
},

{
 id:"SOP-804", sec:"lead", status:"ready", ver:"1.0", owner:"VoIP Support Team Lead",
 title:"Keep this manual alive",
 trigger:"Monthly, plus after every incident.",
 who:"Lead",
 timing:"An hour a month, plus whatever incidents generate",
 why:"Manuals do not die from being wrong, they die from being stale while looking fine. The maintenance cycle is the only thing that separates a living manual from a folder nobody opens.",
 steps:[
  {t:"Work the gaps register down every month",
   d:"Take the top few unanswered questions, ask them, and turn the answers into procedure. A gaps register that never shrinks is a to do list nobody owns."},
  {t:"Review anything touching a carrier or a portal quarterly",
   d:"Those change without telling anybody, and the failure is silent. A procedure naming a menu path is a procedure with an expiry date."},
  {t:"After every incident, ask whether a procedure would have prevented it",
   d:"If yes, write it. If the procedure existed and was not followed, ask why, because the answer is usually that it was hard to find or hard to follow."},
  {t:"Ask every new starter what was missing",
   d:"They have about two weeks of being able to see the gaps, and then they will never see them again. Capture it while it lasts."},
  {t:"Delete what is not used",
   d:"A procedure nobody follows makes the ones that matter harder to find. Removing it is maintenance, not loss."},
  {t:"Keep one owner per procedure and keep the list current",
   d:"When somebody leaves, their procedures get reassigned that week. Orphaned procedures rot fastest."}
 ],
 done:["Gaps register smaller than last month",
       "Carrier and portal procedures reviewed within the quarter",
       "Every incident checked against the manual",
       "No orphaned owners"],
 fails:[{if:"Nobody is reading it",then:"That is a finding about the manual, not about the team. Usually it is too long, too hard to search, or it was never referenced in training. Fix the manual."}]
},

/* ================= 1000 PHONES AND HARDWARE ================= */
{
 id:"SOP-1001", sec:"hw", status:"gap", ver:"0.4", owner:"VoIP Support Team Lead",
 title:"Specify the phones for a practice",
 trigger:"A deal is progressing and somebody needs to know what to order.",
 who:"Support, with sales",
 timing:"During the sales conversation. Never after the deal closes.",
 why:"A phone count is not a headcount and it is not a room count. Getting this wrong produces either a practice with phones sitting in boxes or a practice missing a phone at the busiest desk on the day they go live.",
 steps:[
  {t:"Walk it room by room, not person by person",
   d:"Ask what is in each room today and whether it works. Ask who takes calls and who only makes them. A treatment room needs four keys and a break room needs two. A front desk needs ten and probably an expansion module."},
  {t:"Ask the two questions that decide whether this is an order or a project",
   d:"Does the building have a network cable to every place a phone needs to go. And does the practice have a switch that supplies power over those cables. If the answer to the first is no, that is a cabling contractor with their own timeline, and it belongs in the schedule before any phone ships."},
  {t:"Settle the power question before the order is placed",
   d:"Almost no business desk phone includes a power adapter. The right answer past about four phones is nearly always a switch that powers the phones over the network cable, because it is cheaper and it removes a power brick from every operatory where outlets are already scarce. If you go that way, check the switch's total power budget against the phones going on it.",
   where:"The Phones and Logistics tool, Ordering and shipping, Decide the power question."},
  {t:"Catch the accessories now",
   d:"Headsets, the adapter that lets a wireless headset answer a call from the phone, expansion modules, wall mount brackets. All ship as separate lines and all separately go missing. The headset adapter is model specific, so the wrong one is a return rather than a workaround."},
  {t:"Write the specification as SKUs, not model names",
   d:"The same model is sold in a version with a power supply and a version without, and the base part number differs between them. You cannot change a suffix on a quote and get the other one."}
 ],
 done:["A room by room list with a model against each room",
       "Network cable confirmed to every phone position",
       "Power method decided and written on the order",
       "Accessories listed explicitly",
       "Specification written as SKUs"],
 fails:[{if:"The practice has no network cable where a phone needs to go",then:"That is a cabling job with its own contractor and its own lead time. It goes in the schedule ahead of the hardware, and the cutover date has to respect it."},
        {if:"The practice wants to reuse phones from their previous provider",then:"Expect those phones to be claimed in the previous provider's redirect account, which takes a support ticket and days rather than hours to clear. Price the risk before agreeing."}],
 gaps:[{q:"Which phone models do we actually sell and support, and is there a published hardware list?",who:"Your manager",blocks:"Everything in this procedure. The models we have documented are the ones common in US hosted VoIP, not a confirmed Dental Intelligence list."},
       {q:"Do we sell hardware at all, or do practices buy their own and we only support it?",who:"Your manager",blocks:"Whether ordering is our process or somebody else's"},
       {q:"Is there a network readiness check before a practice is sold a phone system, and who runs it?",who:"Your manager",blocks:"Whether we inherit deployments that were never going to work"}]
},

{
 id:"SOP-1002", sec:"hw", status:"gap", ver:"0.4", owner:"VoIP Support Team Lead",
 title:"Order hardware and land it before the cutover",
 trigger:"The deal is closed and the specification is agreed.",
 who:"Logistics, on our request",
 timing:"Immediately. Work the schedule backwards from the cutover date.",
 why:"There are four different dates in this process and treating them as one date is how a practice ends up with a live phone number and no phones.",
 steps:[
  {t:"Separate the four dates and record them separately",
   d:"Order date is when we place it. Ship date is when it leaves the supplier, and it is the only one the supplier actually controls. Delivery date is ship date plus transit plus a buffer, because a delivery to a practice that closes on Fridays does not arrive on a Friday. Cutover date is when the numbers move, and that one belongs to the carrier."},
  {t:"Require hardware on site at least a week before the cutover",
   d:"Not the day before. A week gives you room to fix a wrong item or a damaged box without moving a carrier date, which is the expensive thing to move."},
  {t:"Ask for the MAC address manifest with the order",
   d:"Some distributors will send a list of every phone's hardware address in the shipment. If ours will, ask every time, because it means every phone can be set up before it arrives and install day becomes a phone call rather than a visit.",
   where:"The Phones and Logistics tool, Ordering and shipping, Provision the phones before they arrive."},
  {t:"Agree that a ship date change is a notification, not a discovery",
   d:"Logistics can only protect a date they know about. Tell them the cutover date, not just the delivery date, so they understand what the real deadline is."},
  {t:"Confirm the delivery the day it lands",
   d:"Have somebody at the practice count boxes and read the labels back to you. Check the accessories specifically. Photograph any damage the same day."}
 ],
 done:["All four dates recorded separately","Hardware on site at least a week before cutover",
       "Tracking recorded on the account","MAC manifest requested",
       "Delivery counted and confirmed against the order, accessories included"],
 fails:[{if:"Hardware will not arrive a week before the cutover",then:"Say so immediately and move the cutover. Hoping is the version that loses a customer."}],
 gaps:[{q:"Who is our hardware distributor, what are their lead times by model, and do they provide a MAC manifest?",who:"Logistics",blocks:"Quoting a delivery date instead of guessing"},
       {q:"Who ships to the practice, us or the supplier direct, and who confirms the delivery arrived complete?",who:"Logistics",blocks:"Whether the delivery check is our step"},
       {q:"Does anybody install on site, or is every deployment remote with the practice unboxing their own phones?",who:"Your manager",blocks:"How much detail customer facing instructions need"}]
},

{
 id:"SOP-1003", sec:"hw", status:"gap", ver:"0.6", owner:"VoIP Support Team Lead",
 title:"Set up a desk phone",
 trigger:"A phone needs to go from a box to a working extension.",
 who:"Support",
 timing:"Five minutes of work, up to thirty minutes of waiting",
 why:"A phone arrives from the factory knowing nothing. Getting settings onto it is the whole job, and there is a right order that most people discover by getting it wrong.",
 steps:[
  {t:"Create the device on our platform first",
   d:"Before any redirect service can send a phone somewhere useful, the destination has to exist. This ordering is not optional. A phone that redirects perfectly and then finds no record sits there showing No Service while the logs say delivered.",
   where:"DialStack. Exact screen path unknown, see the open questions.",
   pri:true},
  {t:"Put the hardware address into the manufacturer's redirect service",
   d:"Yealink calls this RPS, Poly calls it ZTP. Both are just a forwarding address: for this hardware address, go to this server. They hold no settings and no passwords. Most platforms push this automatically when you add the device, and whether ours does is one of the things to find out.",
   where:"Yealink: dm.yealink.com. Poly: partner.ztp.poly.com. Both need a partner account, which a practice can never have."},
  {t:"Plug it in and leave it alone",
   d:"Network port, not the port marked PC. A phone that has been in a cupboard may reboot four or five times over half an hour while it steps through firmware versions. That is normal. Never unplug it during that, because an interrupted firmware update is the one way to genuinely break a phone rather than just misconfigure it."},
  {t:"Prove it works before you leave",
   d:"A phone showing an extension number is not a working phone. Test audio in both directions on an outside call, because a phone can register perfectly and still have no sound. Call setup and the actual voice travel on completely separate paths."},
  {t:"Register the emergency address for this specific phone",
   d:"Not the practice. This phone. See SOP-601. A phone that can call out but has no address on file can call for help and not be found.",
   pri:true}
 ],
 done:["Device created on the platform with the hardware address checked character by character",
       "Redirect entry made, or confirmed automatic",
       "Phone registered and showing the right extension",
       "Audio tested in both directions on an outside call",
       "Inbound tested, the right phone rings",
       "Emergency address registered and confirmed provisioned"],
 fails:[{if:"The phone reboots several times on its own and lands on No Service, or the default password does not work",then:"That is the signature of a hardware address still claimed by a previous provider. Resetting the phone will not fix it, because the claim lives on a server at the manufacturer. Go to the stuck phone procedure in the Phones and Logistics tool and start the release ticket today, because it takes days."},
        {if:"The phone has no address at all and says Network Unavailable",then:"This is not a provisioning problem. It is a cable, a switch port, or a network problem, and no amount of typing settings will fix it."}],
 watch:["DialStack allows at most one physical device per user, a desk phone or a cordless handset. Softphone sessions are separate and unlimited, and everything registered rings at the same time. Two desk phones for one person means two users, which is a licensing conversation before it is a hardware one."],

       {q:"Does DialStack push the hardware address to the manufacturer's redirect service automatically, or does somebody enter it by hand?",who:"DialStack administrator",blocks:"Whether the second step of this procedure exists at all"},
       {q:"Do we hold a Yealink partner account and a Poly partner account for the redirect services? If not, who stages phones for us?",who:"Your manager",blocks:"Whether we can provision phones ourselves or depend on a distributor for every order"}]

{
 id:"SOP-1004", sec:"hw", status:"gap", ver:"0.3", owner:"VoIP Support Team Lead",
 title:"Replace a phone that is faulty or wrong",
 trigger:"A phone does not work, or the wrong item arrived.",

 timing:"Same day to identify. Replacement per the supplier.",
 why:"Three different problems get called the same thing and they have three different paths, three different cost owners, and three different deadlines.",

  {t:"Prove it is actually the phone before you call it faulty",
   d:"Move it to a known good network port with a known good cable. A phone that works on another port was never faulty, and a warranty claim on a working phone wastes a week."},
  {t:"Sort it into one of three categories",
   d:"Wrong item sent, which is either our ordering error or the supplier's and somebody has to say which, because that is the difference between a free swap and a restocking charge. Damaged in transit, which is a carrier claim with a time limit and needs photographs and the original packaging. Faulty in use, which is a warranty claim."},
  {t:"Give the practice something that works today",
   d:"A softphone on their computer takes two minutes and buys a week. Never leave somebody without a phone while a replacement ships, least of all at a front desk."},
  {t:"Update both records when the hardware address changes",
   d:"A replacement phone has a different hardware address. The old one has to come off the platform and the new one has to go on, in the platform and in the redirect service. A swap that skips this produces a phone that will never provision and an old record that confuses everybody three months later.",
   pri:true}
 ],

       "Photographs taken where it is a transit claim",
       "Practice given a working interim",

{
 id:"SOP-1102", sec:"cross", status:"gap", ver:"0.3", owner:"VoIP Support Team Lead",
 title:"Route a ticket between our team and application support",
 trigger:"Any request where it is not obvious whose it is.",
 who:"Whoever picked it up",
 timing:"In the first minute",
 why:"The boundary looks obvious and is not. A practice calls to say patient reminders are not going out. Is that ours because it is messaging, or theirs because it is a product feature? Both teams can end up fighting over it, or worse, both dropping it.",
 steps:[
  {t:"Route on the symptom, not on the topic",
   d:"Ask which one broke. Can they make and receive calls. Can they send and receive texts. Or is the software not doing something it should. The first two are ours. The third is theirs, even when the thing the software failed to do involves a message."},
  {t:"Use the one question that settles most of them in ten seconds",
   d:"Can you make calls but not send texts, or the other way round. That single question routes the majority of ambiguous tickets correctly."},
  {t:"Hand over properly or not at all",
   d:"A handover is not a reassignment. Say what you found, what you ruled out, and who is currently talking to the customer. The worst outcome is a practice that has been passed between two teams and now hears from neither, because each assumes the other has it."},
  {t:"When it is genuinely both, one team owns the customer",
   d:"Name that team out loud in the ticket. Shared ownership means nobody calls them back."},
  {t:"Log the ambiguous ones",
   d:"A ticket that was hard to route is data about where the boundary is unclear. Three of the same kind is a conversation to have with the other team lead, with evidence."}
 ],
 done:["Routed on symptom rather than topic",
       "If handed over, the finding and the ruled out list went with it",
       "One team named as owning the customer",
       "Logged if it was genuinely ambiguous"],
 gaps:[{q:"Where is the actual boundary between our team and application support? Specifically, if a practice says patient reminders are not going out, whose ticket is that?",who:"Your manager",blocks:"Ticket routing, how our volume gets counted, and whether anything falls between the two teams"},

/* ================= 900s STAGING ================= */
{
 id:"SOP-950", sec:"stage", status:"gap", ver:"0.2", owner:"VoIP Support Team Lead",
 title:"Build and prove the system on temporary numbers before the port",
 trigger:"A port has been submitted and a date is expected.",
 who:"Onboarding, with the team lead on the cutover decision",
 timing:"Runs across the whole waiting period, which is usually weeks",
 why:"The default way this is done wastes the waiting period. The port is submitted, everybody waits, and then the entire build, install, emergency address registration, training and testing all lands on cutover day, which is the single worst day to discover a problem. Temporary numbers turn that around. The practice can be running on a fully built and fully tested system before their own numbers ever move, and cutover becomes a swap rather than a launch.",
 steps:[
  {t:"Get temporary numbers in the practice's area code",
   d:"One for each handset or extension being built. Local to them, because if calls are going to be forwarded to these numbers the practice may end up giving them out.",
   where:"DialStack or Bandwidth. Whether temporary numbers can be issued for this purpose, and at what cost, is an open question.",
   gap:true,
   pri:true},
  {t:"Build the whole phone system on them",
   d:"Extensions, call routing, the menu, opening hours, holidays, voicemail. Everything they will actually have. Not a partial build, because the point is that nothing is left to do later."},
  {t:"Register emergency addresses on every handset and test with 933",
   d:"This is the part that pays for the whole approach. Emergency address registration is the thing that most needs verifying and is hardest to fix under pressure. Doing it weeks ahead, and confirming with 933 that each handset reads back the right address including the suite, removes it from cutover day entirely.",
   pri:true},
  {t:"Ship and install the phones, and they simply work",
   d:"No waiting for a port. The handsets arrive, get plugged in, register against the temporary numbers, and the practice can make and receive calls that day."},
  {t:"Train the staff on a live, working system",
   d:"Not a demonstration and not a description. They use it. Any confusion surfaces now, while there is time, rather than on the morning their real numbers move."},

  check:["Every line has a decision","Life safety lines excluded","Customer knows they keep paying their old carrier for whatever stays"]},
 {t:"Split the order if you need to",who:"Onboarding",
  d:"Numbers on different accounts, or with different carriers, cannot go on one order.",
  check:["Checked whether one order or several"]},
 {t:"Run the normal port",who:"Onboarding",
  d:"Everything else is the standard process.",
  goto:"voice-new",
  check:["Standard port process started"]}
 ],

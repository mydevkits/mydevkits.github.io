<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live demo · Social Media Presence Kit · MyDevKits</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  /* PLAY - the dark command center */
  --bg:#0a0f18; --card:#0d1726; --border:#1f3a5c; --text:#dbe4f3;
  --muted:#5d738f; --label:#7cd4fc; --green:#35d399; --red:#f87171;
  --amber:#fbbf24; --radius:14px;
  --raise:#12203a; --input:#0a1220; --bubble:#122036; --own:#0f2a22;
  --div:#16243c;
}
body.lighttheme .card,body.lighttheme #sidebar,body.lighttheme #header{box-shadow:0 10px 30px rgba(18,38,63,.07)}
body.lighttheme .btn{color:#053a28}
/* themes room */
.swatch{display:inline-block;width:150px;border:2px solid var(--border);cursor:pointer;
 margin:8px 10px 4px 0;transition:transform .12s;vertical-align:top}
.swatch:hover{transform:translateY(-3px)}
.swatch.on{border-color:var(--green)}
.swatch .sw-top{height:64px;padding:8px;display:flex;flex-direction:column;gap:5px}
.swatch .sw-card{flex:1;display:flex;align-items:center;padding:0 8px;gap:6px;font-size:9px;font-weight:700}
.swatch .sw-dot{width:8px;height:8px;border-radius:50%}
.swatch .sw-name{font-size:11.5px;padding:7px 9px;color:var(--text);background:var(--card);border-top:1px solid var(--border)}
.swatch .sw-name b{display:block;font-size:9px;color:var(--green);letter-spacing:.1em}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,'Segoe UI',sans-serif;font-size:15px}
.mono{font-family:'JetBrains Mono',Consolas,monospace}
#layout{display:flex;min-height:100vh}
#sidebar{width:210px;background:var(--card);border-right:1px solid var(--border);
  padding:18px 10px;flex-shrink:0}
#sidebar h1{font-size:15px;padding:4px 10px 16px;color:var(--text)}
#sidebar h1 span{color:var(--green)}
.navlabel{font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--label);padding:14px 10px 6px}
.nav{display:block;width:100%;text-align:left;padding:9px 12px;margin:2px 0;
  background:none;border:none;border-radius:9px;color:var(--muted);
  font-size:14px;cursor:pointer;font-family:inherit}
.nav:hover{background:var(--raise);color:var(--text)}
.nav.active{background:var(--raise);color:var(--text)}
.nav .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:8px;background:var(--muted)}
.nav .dot.on{background:var(--green)}
.nav .dot.off{background:var(--red)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#header{display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px;border-bottom:1px solid var(--border);background:var(--card)}
#header .crumb{font-size:13px;color:var(--muted)}
#pausebtn{background:none;border:1px solid var(--border);color:var(--muted);
  border-radius:9px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
#pausebtn.paused{border-color:var(--red);color:var(--red)}
#content{padding:26px;max-width:980px;width:100%}
.card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:18px}
.card h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--label);margin-bottom:14px}
textarea,input[type=text],input[type=url],input[type=datetime-local],select{
  width:100%;background:var(--input);border:1px solid var(--border);
  border-radius:9px;color:var(--text);padding:10px 12px;font-size:15px;
  font-family:inherit;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--label)}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.platforms{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.plat{border:1px solid var(--border);border-radius:10px;padding:11px 13px;
  cursor:pointer;user-select:none}
.plat.checked{border-color:var(--green)}
.plat.disabled{opacity:.45;cursor:not-allowed}
.plat .pname{font-weight:600;font-size:14px}
.plat .plimit{font-size:12px;color:var(--muted);margin-top:3px}
.plat .plimit.over{color:var(--red)}
#dropzone{border:1.5px dashed #35507a;border-radius:10px;padding:22px;
  text-align:center;color:var(--text);font-size:14px;cursor:pointer;
  background:var(--bubble)}
#dropzone:hover{background:var(--raise);border-color:var(--label)}
#dropzone.drag{border-color:var(--green);background:var(--own);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--input);
  border:1px solid var(--border);border-radius:8px;padding:5px 10px;
  font-size:13px;margin:6px 6px 0 0}
.chip button{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px}
.opts{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.opts label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.btn{background:var(--green);color:#052018;border:none;border-radius:9px;
  padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.secondary{background:none;border:1px solid var(--border);color:var(--text);font-weight:500}
.btn:disabled{opacity:.5;cursor:wait}
.result{border-radius:9px;padding:10px 14px;margin-top:10px;font-size:14px;
  border:1px solid var(--border)}
.result.ok{border-color:var(--green)}
.result.err{border-color:var(--red)}
.result a{color:var(--label)}
.postrow{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;
  border-bottom:1px solid var(--border);font-size:14px}
.postrow:last-child{border-bottom:none}
.postrow a{color:var(--label);text-decoration:none}
.postrow .when{color:var(--muted);font-size:12px;white-space:nowrap}
.placeholder{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 2px;border-bottom:1px solid var(--border);font-size:14px}
.qrow:last-child{border-bottom:none}
.qrow .qwhen{color:var(--amber);font-size:13px;white-space:nowrap}
.qrow button{background:none;border:1px solid var(--border);color:var(--red);
  border-radius:7px;padding:4px 10px;cursor:pointer;font-size:12px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
/* media chips + grids */
.mchip{position:relative;display:inline-block;margin:8px 8px 0 0;border:1px solid var(--border);
 background:var(--input);transition:transform .15s;z-index:1}
.mchip:hover{transform:scale(1.5);z-index:5;box-shadow:0 8px 30px #000a}
.mchip img,.mchip video{width:86px;height:86px;object-fit:cover;display:block;cursor:default}
.mchip button{position:absolute;top:2px;right:2px;background:#000b;border:none;color:#fff;
 cursor:pointer;font-size:12px;width:20px;height:20px;line-height:1}
.bgshelf{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.bgpick{width:74px;height:120px;object-fit:cover;border:2px solid var(--border);
 cursor:pointer;transition:transform .12s;display:block}
.bgpick:hover{transform:translateY(-3px)}
.bgpick.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.bgsel{position:absolute;top:4px;right:4px;background:#000b;border:1px solid #ffffff66;
 color:#fff;cursor:pointer;width:24px;height:24px;font-size:13px;line-height:1}
.bgsel.on{background:var(--green);color:#052018;border-color:var(--green)}
.bgwrap{position:relative;display:inline-block}
#lightbox{display:none;position:fixed;inset:0;background:rgba(4,8,13,.92);z-index:200;
 align-items:center;justify-content:center;cursor:default}
#lightbox.open{display:flex}
#lightbox img,#lightbox video{max-width:92vw;max-height:92vh;box-shadow:0 20px 80px #000}
#lightbox .lbx{position:fixed;top:18px;right:26px;background:none;border:1px solid #ffffff55;
 color:#fff;font-size:16px;width:38px;height:38px;cursor:pointer}
#lbedit{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:8px;
 width:min(560px,92vw);background:#0d1726ee;border:1px solid #1f3a5c;padding:10px}
#lbedit input{flex:1;background:#0a1220;border:1px solid #1f3a5c;color:#dbe4f3;
 padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
#lbedit button{background:#35d399;color:#052018;border:none;padding:10px 18px;
 font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
#lbedit button:disabled{opacity:.5}
.lbarrow{position:fixed;top:50%;transform:translateY(-50%);background:none;border:none;
 color:#ffffffcc;font-size:54px;font-weight:200;cursor:pointer;padding:30px 22px;
 user-select:none;transition:color .12s,transform .12s;font-family:inherit;line-height:1}
.lbarrow:hover{color:#35d399;transform:translateY(-50%) scale(1.15)}
.lbarrow.left{left:8px}.lbarrow.right{right:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{border:1px solid var(--border);background:var(--input);overflow:hidden}
.pcard .pmedia{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bubble)}
.pcard .pnone{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
 color:var(--muted);font-size:26px;background:var(--bubble)}
.pcard .pinfo{padding:8px 10px}
.pcard .pinfo a{color:var(--label);font-size:11.5px;text-decoration:none;word-break:break-all}
.pcard .pwhen{font-size:10px;color:var(--muted);margin-top:4px}
/* ---------- phone layout ---------- */
@media(max-width:860px){
  #layout{flex-direction:column}
  #sidebar{width:100%;display:flex;align-items:center;gap:4px;padding:10px 12px;
   overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);
   position:sticky;top:0;z-index:40;-webkit-overflow-scrolling:touch}
  #sidebar h1{font-size:12px;padding:0 10px 0 0;white-space:nowrap}
  #sidebar h1 br{display:none}
  .navlabel{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 12px;font-size:13px;flex-shrink:0}
  #header{padding:10px 14px}
  #content{padding:14px;max-width:100%}
  .card{padding:14px}
  .row{gap:8px}
  .btn{padding:10px 14px;font-size:13px}
  .platforms{grid-template-columns:1fr 1fr}
  .qrow,.postrow{flex-wrap:wrap}
  input[type=datetime-local]{width:100%!important}
  #pausebtn,#themebtn{padding:6px 8px;font-size:11px}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}

/* pressable toggle buttons */
.tgl{background:var(--bubble);border:1px solid var(--border);color:var(--text);
  padding:3px 10px;cursor:pointer;font-size:12px;font-family:inherit;line-height:1.4}
.tgl:hover{border-color:var(--label)}
.tgl:active{transform:translateY(1px);background:var(--input)}
/* demo guidance layer */
.nav:hover,.btn:hover,.tgl:hover,.plat:hover:not(.disabled),
.bgsel:hover,#pausebtn:hover,#themebtn:hover,#dropzone:hover,
.qrow button:hover,.libplay:hover,select:hover,.lbarrow:hover,.lbx:hover{
 outline:2px solid rgba(53,211,153,.6);outline-offset:2px}
.mchip:hover,.bgpick:hover,.pcard:hover{outline:2px solid rgba(53,211,153,.6);outline-offset:2px}
#sprompt:hover{outline:2px solid rgba(53,211,153,.6);outline-offset:2px}
.card:has(#sprompt:hover) #genbtn{outline:2px solid rgba(53,211,153,.6);outline-offset:2px}
#text:hover,#themelight:hover,#themedark:hover,#queuecard:hover{
 outline:2px solid rgba(53,211,153,.6);outline-offset:3px}
#capsarea:hover,#storyarea:hover,#paintrow:hover,#constraints:hover,
#musiccard:hover,#platroom:hover,#numroom:hover{
 outline:2px solid rgba(53,211,153,.6);outline-offset:3px}
.clickhint-gen{display:none;position:absolute;left:50%;transform:translateX(-50%);
 top:-24px;margin:0;pointer-events:none}
.card:has(#sprompt:hover) .clickhint-gen,.card:has(#genbtn:hover) .clickhint-gen{display:block}
.clickhint{color:var(--green);font-family:ui-monospace,Consolas,monospace;
 font-size:12px;letter-spacing:.08em;margin:0 10px;white-space:nowrap;font-weight:700}
.pficon{display:inline-block;padding:1px 4px}
.pficon:hover{outline:2px solid rgba(53,211,153,.7);outline-offset:1px}
#demotip{position:fixed;z-index:400;max-width:260px;background:var(--card);
 border:1px solid var(--green);color:var(--text);font-size:12.5px;line-height:1.5;
 padding:9px 12px;pointer-events:none;display:none;box-shadow:0 10px 30px #0008}
/* numbers */
.ntile .nval{font-size:26px;font-weight:700;font-family:ui-monospace,Consolas,monospace}
.spark{border:1px solid var(--border);background:var(--input);padding:12px 14px}
.spark .sl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--label);margin-bottom:6px}
.spark .sv{font-size:17px;font-weight:700;font-family:ui-monospace,Consolas,monospace}
.spark .sd{font-size:11px;color:var(--green)}
.btn:active,.nav:active,#pausebtn:active{transform:translateY(1px)}
@media(max-width:640px){.clickhint{display:none!important}}
/* crisp corners everywhere (status dots stay round) */
#layout *,#layout{border-radius:0!important}
.dot{border-radius:50%!important}
</style>
</head>
<body>
<div id="layout">
  <div id="sidebar">
    <h1>MYDEVKITS <span>&#9679;</span><br><span style="font-size:9px;letter-spacing:.24em;color:var(--muted)">SOCIAL MEDIA PRESENCE</span></h1>
    <div class="navlabel">Rooms</div>
    <button class="nav active" data-view="composer">Composer</button>
    <button class="nav" data-view="studio">Studio</button>
    <button class="nav" data-view="inbox">Inbox</button>
    <button class="nav" data-view="numbers">Numbers</button>
    <button class="nav" data-view="themes">Themes</button>
    <button class="nav" data-view="library">Library</button>
    <div class="navlabel">Platforms</div>
    <button class="nav" data-view="facebook"><span class="dot" id="dot-facebook"></span>Facebook</button>
    <button class="nav" data-view="instagram"><span class="dot" id="dot-instagram"></span>Instagram</button>
    <button class="nav" data-view="x"><span class="dot" id="dot-x"></span>X</button>
    <button class="nav" data-view="youtube"><span class="dot" id="dot-youtube"></span>YouTube</button>
  </div>
  <div id="main">
    <div id="header">
      <span class="crumb" id="crumb">Composer</span>
      <span class="mono" style="border:1px solid var(--amber);color:var(--amber);font-size:10px;letter-spacing:.16em;padding:4px 10px;margin-left:12px">DEMO</span>
      <span style="display:flex;gap:10px">
      <span class="clickhint">try me &#8594;</span><button id="themebtn" onclick="toggleTheme()" style="background:none;border:1px solid var(--border);color:var(--muted);padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit">&#9728; work mode</button>
      <button id="pausebtn" onclick="togglePause()">&#9646;&#9646; queue running</button>
      </span>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="demotip"></div>
<a id="leavedemo" href="index.html" style="display:none;position:fixed;right:16px;bottom:16px;z-index:500;background:#0d1726;border:1px solid #35d399;color:#dbe4f3;font-size:11px;letter-spacing:.1em;padding:10px 16px;text-decoration:none;font-family:ui-monospace,Consolas,monospace;box-shadow:0 10px 30px #000a">&#8592; LEAVE DEMO</a>
<script>if(window.self===window.top)document.getElementById('leavedemo').style.display='block';</script>
<div id="lightbox" onclick="closeLightbox()">
  <button class="lbx" onclick="closeLightbox()">&#10005;</button>
  <button class="lbarrow left" onclick="event.stopPropagation();lbNav(-1)">&#8249;</button>
  <span id="lbslot"></span>
  <button class="lbarrow right" onclick="event.stopPropagation();lbNav(1)">&#8250;</button>
  <div id="lbedit" onclick="event.stopPropagation()">
    <input id="lbprompt" placeholder="Describe an edit for THIS photo... 'make the sky golden hour', 'remove the car'"
      oninput="LB_DRAFTS[(LB_LIST||media)[LB_IDX]]=this.value"
      onkeydown="if(event.key==='Enter')aiEditPhoto()">
    <button id="lbeditbtn" onclick="aiEditPhoto()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>Edit</button>
  </div>
</div>
<script>
let LB_IDX=-1,LB_LIST=null,LB_DRAFTS={},LB_PREFIX='/uploads/',LIB_BG=[];
function lbShow(i){
  const list=LB_LIST||media;
  if(!list.length)return;
  LB_IDX=(i+list.length)%list.length;
  const m=list[LB_IDX];
  const isvid=/\.(mp4|mov|m4v|avi|webm)$/i.test(m);
  document.querySelectorAll('.lbarrow').forEach(a=>a.style.display=list.length>1?'block':'none');
  document.getElementById('lbedit').style.display=(isvid||LB_PREFIX!=='/uploads/')?'none':'flex';
  const lp=document.getElementById('lbprompt');
  if(lp&&!isvid){lp.value=LB_DRAFTS[m]||'';}
  document.getElementById('lbslot').innerHTML=isvid
    ?'<video src="'+U(m)+'" controls autoplay onclick="event.stopPropagation()"></video>'
    :'<img src="'+U(m)+'">';
}
function openLightbox(m,which){
  if(which==='bg'){LB_LIST=LIB_BG;LB_PREFIX='/backgrounds/';}
  else if(which==='s'){LB_LIST=SMEDIA;LB_PREFIX='/uploads/';}
  else{LB_LIST=media;LB_PREFIX='/uploads/';}
  lbShow(Math.max(0,LB_LIST.indexOf(m)));
  document.getElementById('lightbox').classList.add('open');
}
async function aiEditPhoto(){
  const list=LB_LIST||media,m=list[LB_IDX];
  const inp=document.getElementById('lbprompt'),btn=document.getElementById('lbeditbtn');
  const ins=(inp.value||'').trim();if(!ins)return;
  btn.disabled=true;btn.textContent='Editing...';
  try{
    const r=await api('/api/studio/edit_photo',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({photo:m,instruction:ins})});
    if(r.error){alert(r.error);return;}
    delete LB_DRAFTS[m];
    list.push(r.photo);
    if(LB_LIST===SMEDIA)paintSChips();else{paintChips();paintLimits();}
    inp.value='';
    lbShow(list.length-1);
  }finally{btn.disabled=false;btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>Edit';}
}
function lbNav(d){lbShow(LB_IDX+d);}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lbslot').innerHTML='';LB_IDX=-1;
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  if(e.key==='Escape')closeLightbox();
  if(e.key==='ArrowLeft')lbNav(-1);
  if(e.key==='ArrowRight')lbNav(1);
});
(function(){let tx=null;
  const lb=document.getElementById('lightbox');
  lb.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
  lb.addEventListener('touchend',e=>{
    if(tx===null)return;
    const dx=e.changedTouches[0].clientX-tx;tx=null;
    if(Math.abs(dx)>60)lbNav(dx<0?1:-1);
  },{passive:true});
})();
const LIMITS={x:280,instagram:2200,facebook:63206,youtube:5000};
const PNAMES={facebook:"Facebook",instagram:"Instagram",x:"X",youtube:"YouTube"};
let STATUS={platforms:{}},media=[],checked={facebook:false,instagram:false,x:false,youtube:false},overrides={};

/* ================= DEMO STAGING LAYER ================= */
const DEMO_FILES={
 'sunrise_jobsite.png':'demo/bg/backdrop_sunset.png',
 'shop_floor.png':'demo/bg/backdrop_charcoal_bokeh.png',
 'edit_demo.png':'demo/bg/backdrop_purple_glow.png',
 'studio_demo.mp4':'demo/demo_video.mp4',
 'launch_video.mp4':'demo/demo_video.mp4'
};
function U(m){return DEMO_FILES[m]||('demo/bg/'+m);}
/* Demo-only media: the demo NEVER touches the visitor's real camera or files. */
let SAMPLE_N=0;
const SAMPLE_POOL=['backdrop_sunset.png','backdrop_emerald_waves.png','backdrop_neon_horizon.png','backdrop_warm_paper.png'];
function demoSampleName(kind){
  SAMPLE_N++;
  if(kind==='video'){const n='sample_clip_'+SAMPLE_N+'.mp4';DEMO_FILES[n]='demo/demo_video.mp4';return n;}
  const n='sample_photo_'+SAMPLE_N+'.png';
  DEMO_FILES[n]='demo/bg/'+SAMPLE_POOL[SAMPLE_N%SAMPLE_POOL.length];
  return n;
}
function demoToast(msg){
  let t=document.getElementById('demotoast');

function activeRules(){
  const sel=selectedPlatforms();
  if(!sel.length)return null;
  const imgs=media.filter(m=>!isVideo(m)),vids=media.filter(isVideo);
  const rules={sel,problems:[]};
  for(const p of sel){
    const t=effText(p);
    if(t.length>LIMITS[p])
      rules.problems.push(PNAMES[p]+' text is '+t.length+' chars (allows '+LIMITS[p]+') - add a custom caption for it or shorten.');
  }
  if(sel.includes('youtube')&&!vids.length)
    rules.problems.push('YouTube needs a video attached.');
  if(sel.includes('instagram')&&!media.length)
    rules.problems.push('Instagram needs an image or video attached.');
  if(sel.includes('x')&&imgs.length>4)
    rules.problems.push('X allows at most 4 images ('+imgs.length+' attached).');
  return rules;
}

let INBOX_TIMER=null,INBOX_FILTER='active',EXPANDED={};
function renderInbox(){
  const c=document.getElementById('content');
  c.innerHTML=`
  <div class="card"><h2>Unified inbox</h2>
    <div class="row" style="margin-bottom:12px">
      <span id="inboxcount" class="note" style="flex:1"></span>
      <button class="btn secondary" id="fActive" style="padding:6px 12px;font-size:12px" onclick="setFilter('active')">Active</button>
      <button class="btn secondary" id="fWait" style="padding:6px 12px;font-size:12px" onclick="setFilter('wait')">Awaiting reply</button>
      <button class="btn secondary" id="fDone" style="padding:6px 12px;font-size:12px" onclick="setFilter('done')">Finished</button>
    </div>
    <div id="inboxbox"><div class="placeholder">loading...</div></div>
  </div>`;
  loadInbox();
  clearInterval(INBOX_TIMER);
  INBOX_TIMER=setInterval(()=>{
    if(document.getElementById('inboxbox'))loadInbox();else clearInterval(INBOX_TIMER);
  },30000);
}
function setFilter(f){INBOX_FILTER=f;loadInbox();}
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function toggleConvo(id){EXPANDED[id]=!EXPANDED[id];loadInbox();}
async function markFinished(convo,fin){
  await api('/api/chat/finish',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({convo:convo,finished:fin})});
  loadInbox();
}
async function loadInbox(){
  const box=document.getElementById('inboxbox');if(!box)return;
  const r=await api('/api/chat/conversations');
  if(r.error){box.innerHTML='<div class="result err">'+esc(r.error)+'</div>';return;}
  const all=r.conversations.slice();
  const isWaiting=c=>!c.finished&&c.messages.length&&c.messages[c.messages.length-1].from==='visitor';
  const active=all.filter(c=>!c.finished),done=all.filter(c=>c.finished);
  const waiting=active.filter(isWaiting).length;
  const cnt=document.getElementById('inboxcount');
  if(cnt)cnt.textContent=active.length+' active · '+waiting+' awaiting reply · '+done.length+' finished';
  const marks={active:'fActive',wait:'fWait',done:'fDone'};
  for(const k in marks){const b=document.getElementById(marks[k]);
    if(b)b.style.borderColor=(INBOX_FILTER===k)?(k==='wait'?'var(--amber)':'var(--green)'):'var(--border)';}
  let convos=INBOX_FILTER==='done'?done:INBOX_FILTER==='wait'?active.filter(isWaiting):active;
  convos.sort((a,b)=>(isWaiting(b)-isWaiting(a))||((b.updated||0)-(a.updated||0)));
  if(!convos.length){
    box.innerHTML='<div class="placeholder">'+(INBOX_FILTER==='done'
      ?'No finished conversations yet.'
      :INBOX_FILTER==='wait'?'Nothing awaiting reply. Inbox zero.'
      :'No active conversations. Check the Finished tab or enjoy the quiet.')+'</div>';
    return;}
  box.innerHTML=convos.map(c=>{
    const waitingC=isWaiting(c);
    const open=(c.convo in EXPANDED)?EXPANDED[c.convo]:(waitingC&&INBOX_FILTER!=='done');
    const last=c.messages[c.messages.length-1]||{};
    const when=c.updated?new Date(c.updated).toLocaleString():'';
    const head='<div style="display:flex;align-items:center;gap:10px">'+
      '<button class="tgl" onclick="toggleConvo(\''+c.convo+'\')">'+(open?'&#9662; close':'&#9656; open')+'</button>'+
      '<strong style="font-size:14px;white-space:nowrap"><span class="pficon">&#127760;</span> '+(esc(c.name)||'Visitor')+
      (c.email?' <span style="color:var(--muted);font-weight:400;font-size:12px">('+esc(c.email)+')</span>':'')+'</strong>'+
      (open?'<span style="flex:1"></span>':'<span style="color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+esc((last.text||'').slice(0,70))+'</span>')+
      '<span style="font-size:11px;color:var(--muted);white-space:nowrap">'+when+'</span>'+
      (c.finished
        ?'<button class="tgl" style="color:var(--green)" onclick="markFinished(\''+c.convo+'\',false)">&#8634; reactivate</button>'
        :(waitingC?'<span style="color:var(--amber);font-size:12px;white-space:nowrap">&#9679; awaiting</span>':''))+
      '</div>';
    if(!open)return '<div style="border:1px solid '+(c.finished?'var(--border)':waitingC?'var(--amber)':'var(--border)')+
      ';padding:12px 14px;margin-bottom:10px'+(c.finished?';opacity:.7':'')+'">'+head+'</div>';
    const msgs=c.messages.map(m=>
      '<div style="margin:6px 0;padding:8px 12px;font-size:14px;max-width:85%;'+
      (m.from==='visitor'
        ?'background:var(--bubble);border:1px solid var(--border)'
        :'background:var(--own);border:1px solid var(--green);margin-left:auto')+
      '">'+esc(m.text)+'<div style="font-size:11px;color:var(--muted);margin-top:4px">'+
      (m.from==='visitor'?(esc(c.name)||'visitor'):'you')+' &middot; '+
      new Date(m.ts).toLocaleString()+'</div></div>').join('');
    const replyRow=c.finished?'':'<div class="row" style="margin-top:10px">'+
      '<input type="text" id="rep_'+c.convo+'" placeholder="Write a reply..." style="flex:1" '+
      'onkeydown="if(event.key===\'Enter\')sendChatReply(\''+c.convo+'\')">'+
      '<button class="btn" style="padding:9px 16px" onclick="sendChatReply(\''+c.convo+'\')">Reply</button>'+
      '<button class="tgl" style="padding:9px 12px" onclick="markFinished(\''+c.convo+'\',true)">&#10003; finished</button>'+
      '</div>';
    return '<div style="border:1px solid '+(c.finished?'var(--border)':waitingC?'var(--amber)':'var(--border)')+
      ';padding:12px 14px;margin-bottom:10px'+(c.finished?';opacity:.85':'')+'">'+head+
      '<div class="thread" id="th_'+c.convo+'" style="max-height:280px;overflow-y:auto;margin-top:8px;padding-right:6px">'+msgs+'</div>'+
      replyRow+'</div>';
  }).join('');
  document.querySelectorAll('.thread').forEach(t=>t.scrollTop=t.scrollHeight);
}
async function sendChatReply(convo){
  const inp=document.getElementById('rep_'+convo);
  const t=(inp.value||'').trim();if(!t)return;
  inp.disabled=true;
  const r=await api('/api/chat/reply',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({convo:convo,text:t})});
  inp.disabled=false;
  if(r.error)alert(r.error);else{inp.value='';loadInbox();}
}

 const mn=Math.min(...series),mx=Math.max(...series);

async function studioUpload(files){

function studioVideoTag(){
  return '<video src="'+U(STUDIO.video)+'" controls style="width:250px;margin-top:12px;border-radius:10px;border:1px solid var(--border)"></video>'+
    '<div class="note">Saved as '+STUDIO.video+'</div>';
}
function bgThumbSize(){
  const f=(document.getElementById('s_fmt')||{}).value||'portrait';
  return f==='landscape'?'width:128px;height:72px':
         f==='square'?'width:96px;height:96px':'width:74px;height:120px';
}
function loadBackdrops(){
  api('/api/studio/backgrounds').then(r=>{
    const el=document.getElementById('bgshelf');if(!el)return;
    if(!r.backgrounds||!r.backgrounds.length){el.innerHTML='<span class="note">Shelf is empty - drop images into social-hub\\backgrounds</span>';return;}
    const dim=bgThumbSize();
    LIB_BG=r.backgrounds;
    el.innerHTML=r.backgrounds.map(b=>
      '<span class="bgwrap">'+
      '<img class="bgpick'+(STOCK.includes(b)?' on':'')+'" style="'+dim+'" src="demo/bg/'+b+'" loading="lazy" title="'+b+'" onclick="openLightbox(\''+b+'\',\'bg\')">'+
      '<button class="bgsel'+(STOCK.includes(b)?' on':'')+'" title="use in video" onclick="event.stopPropagation();toggleBackdrop(\''+b+'\')">'+(STOCK.includes(b)?'&#10003;':'+')+'</button>'+
      '</span>').join('');
  });
}
function toggleBackdrop(b){
  const i=STOCK.indexOf(b);
  if(i>=0)STOCK.splice(i,1);
  else{
    if(STOCK.length>=6)return alert('Six backdrops max - they rotate through the scenes; more would never be seen.');
    STOCK.push(b);
  }
  loadBackdrops();
}
async function genBackdrop(){
  const inp=document.getElementById('bgprompt'),btn=document.getElementById('bggen');
  const d=(inp.value||'').trim();if(!d)return alert('Describe the backdrop first.');
  btn.disabled=true;btn.textContent='Painting...';
  try{
    const r=await api('/api/studio/gen_background',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:d})});
    if(r.error){alert(r.error);return;}
    if(STOCK.length<6)STOCK.push(r.background);
    inp.value='';loadBackdrops();
    btn.textContent='Painted ✓ saved to Library';
    setTimeout(function(){btn.textContent='Paint backdrop';},2800);
  }finally{btn.disabled=false;if(btn.textContent==='Painting...')btn.textContent='Paint backdrop';}
}
async function studioBuildVideo(n){
  stopPreview();
  const btn=document.getElementById('vbtn');
  btn.disabled=true;btn.textContent='Building (voiceover + cards + ffmpeg)...';
  const scenes=[];
  for(let i=0;i<n;i++)scenes.push({headline:document.getElementById('sc_h'+i).value,
    sub:document.getElementById('sc_s'+i).value});
  try{
    const r=await api('/api/studio/build_video',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({scenes:scenes,
        voiceover:document.getElementById('s_voicepick').value===''?'':document.getElementById('s_voice').value,
        voice:document.getElementById('s_voicepick').value,photos:SMEDIA,
        music:document.getElementById('s_music').value,
        music_vol:document.getElementById('s_mvol').value/100,
        stock:STOCK,fmt:document.getElementById('s_fmt').value})});
    if(r.error){document.getElementById('vpreview').innerHTML=
      '<div class="result err">'+r.error+'</div>';return;}
    STUDIO.video=r.video;
    document.getElementById('vpreview').innerHTML=studioVideoTag();
  }finally{btn.disabled=false;btn.textContent='Build video preview';}
}
function studioToComposer(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  const text=g('s_facebook')||g('s_x');
  overrides={x:g('s_x'),instagram:g('s_instagram')};
  if(STUDIO.video&&!media.includes(STUDIO.video))media.push(STUDIO.video);
  SMEDIA.forEach(m=>{if(!media.includes(m))media.push(m);});
  for(const k in checked)checked[k]=false;
  checked.facebook=!!STATUS.platforms.facebook;
  checked.x=!!STATUS.platforms.x&&g('s_x').length>0;
  if(STUDIO.video)checked.youtube=!!STATUS.platforms.youtube;
  window._studioPrefill={text:text,yt_title:g('s_yt_title'),yt_desc:g('s_yt_desc')};
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  document.querySelector('.nav[data-view=composer]').classList.add('active');
  show('composer');paintOpts();
  document.getElementById('text').value=text;
  const yt=document.getElementById('yt_title');if(yt)yt.value=g('s_yt_title');
  const yd=document.getElementById('yt_description');if(yd)yd.value=g('s_yt_desc');
  paintLimits();
}

/* ---------------- Platform tabs ---------------- */
async function renderPlatform(p){
  const c=document.getElementById('content');
  const avail=STATUS.platforms[p];
  const note=p==='instagram'&&!avail
    ?'<div class="card"><div class="placeholder">Instagram is parked: link it to your Facebook Page, regenerate the token, run the roll call - and this tab lights up with no rebuild.</div></div>':'';
  c.innerHTML='<div id="platroom">'+note+
    '<div class="card"><h2>Recent posts from this hub</h2><div id="plog">loading...</div></div>'+
    (avail?'<div class="card"><h2>Quick compose &rarr; '+PNAMES[p]+' only</h2>'+
    '<div class="note">Opens the Composer with just '+PNAMES[p]+' selected.</div>'+
    '<button class="btn secondary" style="margin-top:10px" onclick="quickCompose(\''+p+'\')">Compose for '+PNAMES[p]+'</button></div>':'')+'</div>';
  const r=await api('/api/published?platform='+p);
  const el=document.getElementById('plog');
  el.innerHTML=r.items.length?'<div class="pgrid">'+r.items.map(e=>{
    let media_el='<div class="pnone">&#128240;</div>';
    if(e.media&&e.media.length){
      const m=e.media[0],ext=m.slice(m.lastIndexOf('.')).toLowerCase();
      if(['.mp4','.mov','.m4v','.avi','.webm'].includes(ext))
        media_el='<video class="pmedia" src="'+U(m)+'" muted preload="metadata" onmouseover="this.play()" onmouseout="this.pause()" onerror="this.outerHTML=\'<div class=pnone>&#127909;</div>\'"></video>';
      else
        media_el='<img class="pmedia" src="'+U(m)+'" loading="lazy" onerror="this.outerHTML=\'<div class=pnone>&#128247;</div>\'">';
    }
    const extra=(e.media&&e.media.length>1)?' <span style="color:var(--muted)">+'+(e.media.length-1)+'</span>':'';
    return '<div class="pcard">'+media_el+'<div class="pinfo">'+
      '<a href="'+e.url+'" target="_blank">open post &rarr;</a>'+extra+
      '<div class="pwhen mono">'+e.timestamp.slice(0,16).replace('T',' ')+'</div></div></div>';
  }).join('')+'</div>'
    :'<div class="placeholder" style="padding:14px 0">No posts from this hub yet.</div>';
}
function quickCompose(p){
  for(const k in checked)checked[k]=(k===p);
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  document.querySelector('.nav[data-view=composer]').classList.add('active');
  show('composer');paintOpts();
}

const tipEl=document.getElementById('demotip');
document.addEventListener('mouseover',e=>{
  let text=null,anchor=null;
  for(const [sel,t] of TIP_RULES){
    const hit=e.target.closest(sel);
    if(hit){text=t;anchor=hit;break;}
  }
  if(!text){
    const b=e.target.closest('button');
    if(b){const k=b.textContent.trim();if(TEXT_TIPS[k]){text=TEXT_TIPS[k];anchor=b;}}
  }
  if(!text){tipEl.style.display='none';return;}
  tipEl.textContent=text;tipEl.style.display='block';
  const r=anchor.getBoundingClientRect();
  if(anchor.id==='sprompt'||anchor.id==='genbtn'||anchor.closest&&anchor.closest('#sprompt')){
    /* studio prompt + generate: park the info box on the far left so it never covers the button */
    tipEl.style.top=Math.max(8,r.top)+'px';
    tipEl.style.left='8px';
    return;
  }
  let top=r.bottom+10;
  if(top+80>window.innerHeight)top=r.top-10-80;
  tipEl.style.top=top+'px';
  tipEl.style.left=Math.min(Math.max(8,r.left),window.innerWidth-280)+'px';
});
document.addEventListener('mouseout',e=>{if(!e.relatedTarget)tipEl.style.display='none';});
document.addEventListener('click',()=>tipEl.style.display='none');
boot();
